name: Production monitor

# Recurring, delivery-independent check that what users actually reach is
# healthy (issue #110): the landing page and its security headers, the
# /download redirect, the live Sparkle appcast (parses, signed, DMG reachable)
# and that the feed advertises the newest PUBLISHED GitHub release. The
# release-time checks in release.yml only run when we ship; this catches a
# CDN, DNS, GitHub-asset or stray-deploy regression in between.
#
# Failures create/update an incident assigned to the repository owner. This
# avoids relying on the scheduled actor's personal notification settings.
# A healthy rerun closes that incident; failures still keep the workflow red.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # Create/update only the production monitor's incident issue

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  live-probe:
    name: Probe pasta-app.com, appcast and latest release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        run: ../scripts/ci-npm-ci.sh

      - name: Probe the live site, appcast and download
        working-directory: landing-page
        run: npm run test:live

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Production monitor — $(date -u +'%Y-%m-%d %H:%MZ')"
            echo
            echo "- Result: **${{ job.status }}**"
            echo "- Live appcast top item: $(curl -fsSL https://pasta-app.com/appcast.xml | grep -oE '<title>Version [0-9.]+</title>' | head -1 | sed -E 's/<[^>]+>//g')"
            echo "- Newest published release: $(curl -fsSL -H 'accept: application/vnd.github+json' https://api.github.com/repos/${{ github.repository }}/releases/latest | grep -oE '"tag_name": *"[^"]+"' | head -1 | cut -d'"' -f4)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Route the monitor outcome to its owner
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { reportMonitorResult } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-monitor-incident.mjs`);
            await reportMonitorResult({ github, ...context.repo, runId: context.runId, status: '${{ job.status }}' });
