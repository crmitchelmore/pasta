name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs exist for the landing page jobs below (e.g. to re-run the
  # advisory live probe after a release). Note that a manual run also executes
  # the macOS "Build & Test" job.
  workflow_dispatch:

jobs:
  # ============================================================================
  # LANDING PAGE / UPDATE SURFACE (cheap ubuntu jobs; see landing-page/README.md)
  # ============================================================================

  # Runs on EVERY push/PR: releases rewrite appcast.xml, and a malformed feed
  # silently breaks Sparkle auto-updates for every installed copy of the app.
  appcast-contract:
    name: Appcast & Cloudflare config contract
    runs-on: ubuntu-latest
    # Two bounded npm ci attempts (scripts/ci-npm-ci.sh, 180s each) must fit:
    # a stalled registry connection once pushed a plain npm ci past 5 minutes.
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        # Bounded + retried: a stalled `npm ci` once ate the job timeout and
        # blocked a release (scripts/ci-npm-ci.sh).
        run: ../scripts/ci-npm-ci.sh

      - name: Verify SwiftPM and Xcode dependency locks
        run: python3 scripts/ci-verify-dependency-locks.py

      - name: Test CI and release gate failure handling
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
          node --test scripts/tests/*.test.mjs

      # A tag is created before its release is built and published, so the
      # freshness reference is the newest PUBLISHED release, not the newest
      # tag; otherwise a failed release would block every later CI run (#113).
      # Tolerant on purpose: without this value the contract test only warns.
      - name: Resolve the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          LATEST=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            echo "APPCAST_LATEST_PUBLISHED=${LATEST#v}" >> "$GITHUB_ENV"
            echo "Newest published release: $LATEST"
          else
            echo "::warning::Could not resolve the newest published release from GitHub; the appcast freshness check will only warn on lag."
          fi

      - name: Contract checks (appcast.xml, _redirects, _headers)
        working-directory: landing-page
        env:
          # release.yml commits the regenerated appcast back to main
          # (scripts/ci-commit-appcast.sh), so the git copy must name the
          # newest published release; a lag now means that commit-back failed.
          APPCAST_REQUIRE_LATEST: '1'
        run: npm run test:contract

  # Detect whether the landing page surface changed so the browser suite only
  # runs when it can possibly be affected.
  landing-changes:
    name: Detect landing page changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            landing:
              - 'landing-page/**'
              - 'scripts/generate-appcast.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-landing-page.yml'
              - '.github/workflows/release.yml'
              - 'scripts/ci-verify-landing-deploy.mjs'

  landing-e2e:
    name: Landing page e2e (Playwright)
    needs: landing-changes
    if: github.event_name == 'workflow_dispatch' || needs.landing-changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        # Bounded + retried: a stalled `npm ci` once ate the job timeout and
        # blocked a release (scripts/ci-npm-ci.sh).
        run: ../scripts/ci-npm-ci.sh

      - name: Install Chromium
        working-directory: landing-page
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke suite
        working-directory: landing-page
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            landing-page/playwright-report/
            landing-page/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ADVISORY: probes the live site (pasta-app.com, GitHub release assets).
  # continue-on-error keeps a CDN/GitHub hiccup from ever blocking a merge; a red
  # run here is a prompt to look, not a broken build. Main pushes + manual only.
  landing-live-probe:
    name: Landing page live probe (advisory)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        # Bounded + retried: a stalled `npm ci` once ate the job timeout and
        # blocked a release (scripts/ci-npm-ci.sh).
        run: ../scripts/ci-npm-ci.sh

      - name: Probe https://pasta-app.com
        working-directory: landing-page
        run: npm run test:live

  # ============================================================================
  # MACOS APP
  # ============================================================================

  test:
    name: Build & Test
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Resolve Swift dependencies
        run: |
          python3 scripts/ci-verify-dependency-locks.py
          swift package resolve --force-resolved-versions
      
      - name: Build
        run: swift build --force-resolved-versions -c debug
      
      - name: Run tests
        run: swift test --force-resolved-versions --parallel

      - name: Test release-notes generator
        run: node --test Tests/ReleaseNotesTests/*.test.mjs

      - name: Test release verification scripts (Sparkle EdDSA)
        run: scripts/tests/ci-verify-eddsa.test.sh
      
      - name: Build release
        run: swift build --force-resolved-versions -c release
      
      - name: Create test app bundle (mirrors release workflow)
        id: bundle
        run: |
          set -e
          echo "==> Creating test app bundle (same as release workflow)..."
          
          APP_DIR=".build/test-bundle/Pasta.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Frameworks"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          # Copy binary
          cp .build/release/PastaApp "$APP_DIR/Contents/MacOS/PastaApp"
          echo "==> Copied binary"
          
          # Copy Sparkle framework (same as release.yml)
          SPARKLE_PATH=$(find .build -name "Sparkle.framework" -type d | head -1)
          if [ -z "$SPARKLE_PATH" ]; then
            echo "ERROR: Sparkle.framework not found!"
            exit 1
          fi
          cp -R "$SPARKLE_PATH" "$APP_DIR/Contents/Frameworks/"
          echo "==> Copied Sparkle from $SPARKLE_PATH"
          
          # Fix rpath (same as release.yml)
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_DIR/Contents/MacOS/PastaApp"
          
          # Create minimal Info.plist
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Pasta</string>
              <key>CFBundleIdentifier</key>
              <string>com.pasta.clipboard.test</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>0.0.0</string>
              <key>CFBundleExecutable</key>
              <string>PastaApp</string>
              <key>LSUIElement</key>
              <true/>
              <key>SUFeedURL</key>
              <string>https://example.com/appcast.xml</string>
          </dict>
          </plist>
          PLIST
          
          echo "APP_DIR=$APP_DIR" >> $GITHUB_OUTPUT
          echo "==> Test bundle created"
      
      - name: Validate release entitlements
        run: |
          # These entitlements cause SIGKILL on launch if not in provisioning profile
          RESTRICTED_KEYS="aps-environment get-task-allow com.apple.developer.team-identifier"
          
          for key in $RESTRICTED_KEYS; do
            if grep -q "<key>${key}</key>" "Resources/release.entitlements"; then
              echo "ERROR: release.entitlements contains restricted key '${key}'."
              echo "This will cause 'The application can't be opened' on user machines."
              echo "Remove it or update the provisioning profile first."
              exit 1
            fi
          done
          echo "✓ No restricted entitlements found"
      
      - name: Sign test bundle (mirrors release signing)
        run: |
          set -e
          APP_DIR="${{ steps.bundle.outputs.APP_DIR }}"
          
          # CI uses ad-hoc signing (no Developer ID cert).
          # iCloud entitlements are restricted and require a provisioning profile,
          # so we strip them for the launch test. The entitlement validation step
          # above catches restricted keys statically.
          
          # Create CI-safe entitlements (non-restricted keys only)
          python3 -c "
          import plistlib, sys
          RESTRICTED_PREFIXES = ['com.apple.developer.icloud', 'aps-environment',
                                 'get-task-allow', 'com.apple.developer.team-identifier']
          with open('Resources/release.entitlements', 'rb') as f:
              ents = plistlib.load(f)
          safe = {k: v for k, v in ents.items()
                  if not any(k.startswith(p) for p in RESTRICTED_PREFIXES)}
          with open('/tmp/ci-entitlements.plist', 'wb') as f:
              plistlib.dump(safe, f)
          print(f'CI entitlements: {list(safe.keys())}')
          "
          
          echo "==> Signing framework binaries (no app entitlements)..."
          find "$APP_DIR/Contents/Frameworks" -type f -perm +111 | while read binary; do
            if file "$binary" | grep -q "Mach-O"; then
              echo "  Signing: $binary"
              codesign --force --sign - --options runtime --timestamp=none "$binary" || true
            fi
          done
          
          find "$APP_DIR/Contents/Frameworks" -name "*.xpc" -o -name "*.app" | while read bundle; do
            if [ -d "$bundle" ]; then
              echo "  Signing bundle: $bundle"
              codesign --force --sign - --options runtime --timestamp=none "$bundle" || true
            fi
          done
          
          find "$APP_DIR/Contents/Frameworks" -name "*.framework" | while read fw; do
            echo "  Signing framework: $fw"
            codesign --force --sign - --options runtime --timestamp=none "$fw" || true
          done
          
          echo "==> Signing main binary with CI entitlements..."
          codesign --force --sign - --options runtime --timestamp=none \
            --entitlements /tmp/ci-entitlements.plist \
            "$APP_DIR/Contents/MacOS/PastaApp"
          
          echo "==> Signing app bundle..."
          codesign --force --sign - --options runtime --timestamp=none \
            --entitlements /tmp/ci-entitlements.plist \
            "$APP_DIR"
          
          codesign --verify --verbose=2 "$APP_DIR"
          
          # Verify entitlements are NOT on framework binaries
          SPARKLE_ENTS=$(codesign -d --entitlements - "$APP_DIR/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" 2>&1 || true)
          if echo "$SPARKLE_ENTS" | grep -q "icloud"; then
            echo "ERROR: Sparkle binary has iCloud entitlements — this will crash at launch!"
            exit 1
          fi
          echo "✓ Framework entitlements are clean"
      
      - name: Verify bundle structure
        run: |
          set -e
          APP_DIR="${{ steps.bundle.outputs.APP_DIR }}"
          
          echo "==> Verifying bundle structure..."
          
          # Check binary exists
          if [ ! -f "$APP_DIR/Contents/MacOS/PastaApp" ]; then
            echo "ERROR: Binary not found!"
            exit 1
          fi
          echo "✓ Binary exists"
          
          # Check Sparkle framework
          if [ ! -d "$APP_DIR/Contents/Frameworks/Sparkle.framework" ]; then
            echo "ERROR: Sparkle.framework not found!"
            exit 1
          fi
          echo "✓ Sparkle.framework exists"
          
          # Check rpath
          echo "==> Verifying rpath:"
          if ! otool -l "$APP_DIR/Contents/MacOS/PastaApp" | grep -A2 LC_RPATH | grep -q "@executable_path/../Frameworks"; then
            echo "ERROR: rpath not set correctly!"
            otool -l "$APP_DIR/Contents/MacOS/PastaApp" | grep -A2 LC_RPATH
            exit 1
          fi
          echo "✓ rpath OK"
      
      # Shared with release.yml (pre- and post-publish, on the notarized bundle)
      # so the smoke test users' builds get is byte-for-byte the one PRs get.
      # Waits for the PASTA_CI_READY marker (see Sources/PastaApp/CIReadiness.swift),
      # then SIGTERM must exit 0.
      - name: Launch smoke test
        run: scripts/ci-launch-smoke.sh "${{ steps.bundle.outputs.APP_DIR }}"

  # Every step below is a subcommand of scripts/ci-ios-e2e.sh, which
  # release-ios.yml's `preflight` job runs identically before any TestFlight
  # upload. Change the script, not the steps, so the two cannot drift.
  ios-e2e:
    name: iOS E2E (XCUITest)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PROJECT: PastaIOS/PastaIOS.xcodeproj
      SCHEME: PastaIOS
      DERIVED_DATA: .build/ios-derived
      RESULT_BUNDLE: .build/ios-e2e/PastaIOSUITests.xcresult
      DIAG_DIR: .build/ios-e2e/diagnostics
      SIM_NAME: PastaCI iPhone

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM checkouts and build intermediates
        uses: actions/cache@v4
        with:
          path: |
            .build/ios-derived/SourcePackages
            .build/ios-derived/Build/Intermediates.noindex
          key: ios-e2e-${{ runner.os }}-${{ hashFiles('Package.resolved', 'PastaIOS/PastaIOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Package.swift', 'PastaIOS/PastaIOS.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ios-e2e-${{ runner.os }}-

      - name: Create iPhone simulator
        run: scripts/ci-ios-e2e.sh create-simulator

      - name: Resolve Swift packages
        run: scripts/ci-ios-e2e.sh resolve

      - name: Build for testing
        run: scripts/ci-ios-e2e.sh build-for-testing

      - name: Run XCUITests
        run: scripts/ci-ios-e2e.sh test

      - name: Summarise results
        if: always()
        run: scripts/ci-ios-e2e.sh summarise

      - name: Collect crash logs and simulator log on failure
        if: failure()
        run: scripts/ci-ios-e2e.sh diagnostics

      - name: Upload result bundle and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-diagnostics
          path: |
            .build/ios-e2e/PastaIOSUITests.xcresult
            .build/ios-e2e/diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Shut down simulator
        if: always()
        run: scripts/ci-ios-e2e.sh cleanup

  # ============================================================================
  # CI GATE: one always-reported check that is green only when EVERY suite on
  # every surface is green: macOS build+tests+launch smoke, iOS XCUITests, the
  # appcast/Cloudflare contract, path detection, and the landing-page Playwright
  # suite whenever it was relevant. A path-filtered "skipped" Playwright result
  # is accepted only when path detection proved the landing page untouched.
  # Because this job always runs, it can be a REQUIRED status check on main
  # (a skipped check never reports and would block or be ignored); the ruleset
  # installed by scripts/owner-require-status-checks.sh requires it. It is also
  # the single condition auto-release depends on (#108).
  # ============================================================================
  ci-gate:
    name: CI gate
    needs: [test, ios-e2e, appcast-contract, landing-changes, landing-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate every gate
        env:
          TEST: ${{ needs.test.result }}
          IOS: ${{ needs.ios-e2e.result }}
          APPCAST: ${{ needs.appcast-contract.result }}
          LANDING_CHANGES: ${{ needs.landing-changes.result }}
          LANDING_TOUCHED: ${{ needs.landing-changes.outputs.landing }}
          LANDING_E2E: ${{ needs.landing-e2e.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          ok=true
          row() { printf '| %s | %s | %s |\n' "$1" "$2" "$3" >> "$GITHUB_STEP_SUMMARY"; }
          { echo "## CI gate"; echo; echo "| Gate | Result | Verdict |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          for pair in "Build & Test:$TEST" "iOS E2E (XCUITest):$IOS" "Appcast & Cloudflare config contract:$APPCAST" "Detect landing page changes:$LANDING_CHANGES"; do
            name="${pair%%:*}"; result="${pair##*:}"
            if [ "$result" = "success" ]; then row "$name" "$result" "✅"; else row "$name" "$result" "❌"; ok=false; fi
          done
          case "$LANDING_E2E" in
            success) row "Landing page e2e (Playwright)" "success" "✅" ;;
            skipped)
              if [ "$LANDING_TOUCHED" != "true" ] && [ "$EVENT" != "workflow_dispatch" ]; then
                row "Landing page e2e (Playwright)" "skipped (landing page untouched)" "✅"
              else
                row "Landing page e2e (Playwright)" "skipped although it was relevant" "❌"; ok=false
              fi ;;
            *) row "Landing page e2e (Playwright)" "$LANDING_E2E" "❌"; ok=false ;;
          esac
          if [ "$ok" = "true" ]; then
            echo "All gates green."
          else
            echo "::error::CI gate: at least one release gate is not green (see the job summary). Fix the red suite; never bypass it."
            exit 1
          fi

  # RELEASE GATE. Tagging a release must wait for the CI gate above, i.e. for
  # EVERY suite on every surface. A red, cancelled or missing result on any of
  # them fails `ci-gate`, so this job never runs and no release.yml /
  # release-ios.yml run is triggered.
  auto-release:
    name: Auto Version & Release
    needs: [ci-gate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Pure git + shell (version bump from conventional commits, tag push): no
    # Xcode needed. Keeping this off macOS spares every release a second wait in
    # the account-wide macOS runner queue, which can run to an hour or more.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_RELEASE_TOKEN }}
      
      - name: Determine version bump from conventional commits
        id: bump
        run: |
          set -e
          
          # Get latest tag
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"
          
          # Get commit messages since last tag (subject lines only)
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          
          if [ -z "$COMMITS" ]; then
            echo "No new commits since $LATEST_TAG"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"
          echo "---"
          
          # Also check commit bodies for BREAKING CHANGE
          BODIES=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%b" --no-merges)
          
          # Determine bump type from conventional commits
          BUMP="none"
          
          # Check for breaking changes: "type!:" prefix or "BREAKING CHANGE:" in body
          if echo "$COMMITS" | grep -qE "^[a-z]+(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$BODIES" | grep -qE "^BREAKING CHANGE:"; then
            BUMP="major"
          # Check for features
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          # Check for fixes and performance improvements
          elif echo "$COMMITS" | grep -qE "^(fix|perf)(\(.+\))?:"; then
            BUMP="patch"
          fi
          
          if [ "$BUMP" = "none" ]; then
            echo "No releasable conventional commits (feat/fix/perf/breaking) found"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Parse current version and apply bump
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Version bump: $BUMP ($LATEST_TAG → $NEW_TAG)"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
      
      - name: Create and push tag
        if: steps.bump.outputs.skip != 'true'
        run: |
          NEW_TAG="${{ steps.bump.outputs.new_tag }}"
          
          # Check if tag already exists
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping"
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
