name: CI

# Fast gate on pull requests, full verification on main (AGENTS.md "Release
# gates"). A pull request runs the Swift build and test suites, the CI/release
# tooling tests and the appcast contract, plus Playwright when the landing page
# changed. The heavy suites -- the release-built, ad-hoc-signed macOS bundle
# with its launch smoke test, and the iOS XCUITests -- run on every main push
# and manual run, on a pull request labelled `ci:full` (the label is read when
# the run starts, so push after adding it), and on a pull request that touches
# the iOS app, packaging/launch scripts or package manifests. Only a fully
# green main run starts an Alpha (alpha-release.yml) or verifies any
# publication (scripts/ci-verify-landing-deploy.mjs); a red main run opens an
# issue (main-ci-responder.yml) and is fixed forward or reverted.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A manual run is treated exactly like a main push: every suite runs.
  workflow_dispatch:

# Read-only by default; jobs that need more declare it explicitly.
permissions:
  contents: read

# One run per ref. A newer pull-request push cancels its superseded run; a
# main run always finishes, so every merged commit gets its own verdict. A
# main re-run takes its own group so it is not replaced by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name != 'pull_request' && github.run_attempt != '1' && format('-attempt-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # LANDING PAGE / UPDATE SURFACE (cheap ubuntu jobs; see landing-page/README.md)
  # ============================================================================

  # Runs on EVERY push/PR: releases rewrite appcast.xml, and a malformed feed
  # silently breaks Sparkle auto-updates for every installed copy of the app.
  appcast-contract:
    name: Appcast & Cloudflare config contract
    # Keep fork PR code on hosted runners; trusted jobs use the dedicated Linux host.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64","omarchy-local"]' || '["ubuntu-latest"]') }}
    # Two bounded npm ci attempts (scripts/ci-npm-ci.sh, 180s each) must fit:
    # a stalled registry connection once pushed a plain npm ci past 5 minutes.
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        # Bounded + retried: a stalled `npm ci` once ate the job timeout and
        # blocked a release (scripts/ci-npm-ci.sh).
        run: ../scripts/ci-npm-ci.sh

      - name: Verify SwiftPM and Xcode dependency locks
        run: python3 scripts/ci-verify-dependency-locks.py

      - name: Set up Ruby test dependencies on the dedicated runner
        if: runner.environment == 'self-hosted'
        run: gem install --user-install --no-document minitest:6.0.6 base64:0.3.0

      - name: Test CI and release gate failure handling
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
          node --test scripts/tests/*.test.mjs
          ruby scripts/tests/release_apple_test.rb

      # A tag is created before its release is built and published, so the
      # freshness reference is the newest PUBLISHED release, not the newest
      # tag; otherwise a failed release would block every later CI run (#113).
      # Tolerant on purpose: without this value the contract test only warns.
      - name: Resolve the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          LATEST=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tagName // empty' 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            echo "APPCAST_LATEST_PUBLISHED=${LATEST#v}" >> "$GITHUB_ENV"
            echo "Newest published release: $LATEST"
          else
            echo "::warning::Could not resolve the newest published release from GitHub; the appcast freshness check will only warn on lag."
          fi

      - name: Contract checks (appcast.xml, _redirects, _headers)
        working-directory: landing-page
        env:
          # release.yml commits the regenerated appcast back to main
          # (scripts/ci-commit-appcast.sh), so the git copy must name the
          # newest published release; a lag now means that commit-back failed.
          APPCAST_REQUIRE_LATEST: '1'
        run: npm run test:contract

  # Routes the run. `landing`: the landing page surface changed, so the browser
  # suite runs. `full`: the heavy native suites run (macOS bundle + launch
  # smoke, iOS XCUITests). `full` is true on every non-pull-request event, for
  # a `ci:full` pull request and for a pull request touching the heavy paths.
  # The job keeps its historical name because publication gates verify it.
  landing-changes:
    name: Detect landing page changes
    # Keep fork PR code on hosted runners; trusted jobs use the dedicated Linux host.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64","omarchy-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
      full: ${{ steps.depth.outputs.full }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            landing:
              - 'landing-page/**'
              - 'scripts/generate-appcast.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-landing-page.yml'
              - '.github/workflows/release.yml'
              - 'scripts/ci-verify-landing-deploy.mjs'
            heavy:
              - 'PastaIOS/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'Resources/**'
              - 'scripts/ci-ios-e2e.sh'
              - 'scripts/ci-launch-smoke.sh'
              - 'scripts/ci-prepare-macos-executable.sh'
              - 'scripts/ci-stage-macos-resources.py'
              - 'scripts/ci-swift.sh'

      - name: Decide whether the heavy native suites run
        id: depth
        env:
          EVENT: ${{ github.event_name }}
          HEAVY: ${{ steps.filter.outputs.heavy }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -u
          if [ "$EVENT" != "pull_request" ] || [ "$HEAVY" = "true" ] || [ "$FULL_LABEL" = "true" ]; then
            full=true
          else
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Heavy native suites on this run: $full (event=$EVENT, heavy paths=$HEAVY, ci:full label=$FULL_LABEL)"

  landing-e2e:
    name: Landing page e2e (Playwright)
    needs: landing-changes
    if: github.event_name == 'workflow_dispatch' || needs.landing-changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        # Bounded + retried: a stalled `npm ci` once ate the job timeout and
        # blocked a release (scripts/ci-npm-ci.sh).
        run: ../scripts/ci-npm-ci.sh

      - name: Install Chromium
        working-directory: landing-page
        run: ../scripts/ci-install-playwright.sh

      - name: Run Playwright smoke suite
        working-directory: landing-page
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            landing-page/playwright-report/
            landing-page/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ADVISORY: probes the live site (pasta-app.com, GitHub release assets).
  # continue-on-error keeps a CDN/GitHub hiccup from ever blocking a merge; a red
  # run here is a prompt to look, not a broken build. Main pushes + manual only.
  landing-live-probe:
    name: Landing page live probe (advisory)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    # Keep fork PR code on hosted runners; trusted jobs use the dedicated Linux host.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64","omarchy-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        # Bounded + retried: a stalled `npm ci` once ate the job timeout and
        # blocked a release (scripts/ci-npm-ci.sh).
        run: ../scripts/ci-npm-ci.sh

      - name: Probe https://pasta-app.com
        working-directory: landing-page
        run: npm run test:live

  # ============================================================================
  # MACOS APP
  # ============================================================================

  # Runs on every event. The fast part (debug build, every Swift test suite
  # including PastaE2ETests, release tooling tests) is the pull-request gate;
  # the release build, ad-hoc-signed bundle and launch smoke test run only when
  # landing-changes routed the heavy suites (always on main). Publication
  # gates check that the "Launch smoke test" step itself succeeded.
  test:
    name: Build & Test
    needs: landing-changes
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.PASTA_NATIVE_RUNNER || 'pasta-local') || 'macos-15' }}
    env:
      FULL: ${{ needs.landing-changes.outputs.full }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select hosted Xcode
        if: runner.environment != 'self-hosted'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      
      - name: Resolve Swift dependencies
        run: |
          python3 scripts/ci-verify-dependency-locks.py
          bash scripts/ci-swift.sh package resolve
      
      - name: Build
        run: bash scripts/ci-swift.sh build -c debug
      
      - name: Run tests
        run: bash scripts/ci-swift.sh test --parallel

      - name: Test release-notes generator
        run: node --test Tests/ReleaseNotesTests/*.test.mjs

      - name: Test release verification scripts (Sparkle EdDSA)
        run: scripts/tests/ci-verify-eddsa.test.sh

      - name: Test macOS packaging and symbol preservation
        run: python3 -m unittest discover -s scripts/tests -p 'test_macos_packaging.py'
      
      - name: Build release
        if: env.FULL == 'true'
        run: |
          bash scripts/ci-swift.sh build -c release
          echo "RELEASE_BIN_DIR=$(bash scripts/ci-swift.sh build -c release --show-bin-path)" >> "$GITHUB_ENV"
          echo "SWIFTPM_ARTIFACTS_DIR=$(bash scripts/ci-swift.sh artifacts)" >> "$GITHUB_ENV"
      
      - name: Create test app bundle (mirrors release workflow)
        if: env.FULL == 'true'
        id: bundle
        run: |
          set -e
          echo "==> Creating test app bundle (same as release workflow)..."
          
          APP_DIR=".build/test-bundle/Pasta.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Frameworks"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          # Copy binary
          bash scripts/ci-prepare-macos-executable.sh "$RELEASE_BIN_DIR/PastaApp"
          cp "$RELEASE_BIN_DIR/PastaApp" "$APP_DIR/Contents/MacOS/PastaApp"
          python3 scripts/ci-stage-macos-resources.py "$RELEASE_BIN_DIR" "$APP_DIR" Resources/DMG/AppIcon.icns
          echo "==> Copied binary"
          
          # Copy Sparkle framework (same as release.yml)
          SPARKLE_PATH=$(find "$SWIFTPM_ARTIFACTS_DIR" -name "Sparkle.framework" -type d -print -quit)
          if [ -z "$SPARKLE_PATH" ]; then
            echo "ERROR: Sparkle.framework not found!"
            exit 1
          fi
          cp -R "$SPARKLE_PATH" "$APP_DIR/Contents/Frameworks/"
          echo "==> Copied Sparkle from $SPARKLE_PATH"
          
          # Fix rpath (same as release.yml)
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_DIR/Contents/MacOS/PastaApp"
          
          # Create minimal Info.plist
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Pasta</string>
              <key>CFBundleIdentifier</key>
              <string>com.pasta.clipboard.test</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>0.0.0</string>
              <key>CFBundleExecutable</key>
              <string>PastaApp</string>
              <key>LSUIElement</key>
              <true/>
              <key>SUFeedURL</key>
              <string>https://example.com/appcast.xml</string>
          </dict>
          </plist>
          PLIST
          
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "==> Test bundle created"
      
      - name: Validate release entitlements
        run: |
          # These entitlements cause SIGKILL on launch if not in provisioning profile
          RESTRICTED_KEYS="aps-environment get-task-allow com.apple.developer.team-identifier"
          
          for key in $RESTRICTED_KEYS; do
            if grep -q "<key>${key}</key>" "Resources/release.entitlements"; then
              echo "ERROR: release.entitlements contains restricted key '${key}'."
              echo "This will cause 'The application can't be opened' on user machines."
              echo "Remove it or update the provisioning profile first."
              exit 1
            fi
          done
          echo "✓ No restricted entitlements found"
      
      - name: Sign test bundle (mirrors release signing)
        if: env.FULL == 'true'
        run: |
          set -e
          APP_DIR="${{ steps.bundle.outputs.APP_DIR }}"
          
          # CI uses ad-hoc signing (no Developer ID cert).
          # iCloud entitlements are restricted and require a provisioning profile,
          # so we strip them for the launch test. The entitlement validation step
          # above catches restricted keys statically.
          
          # Create CI-safe entitlements (non-restricted keys only)
          python3 -c "
          import plistlib, sys
          RESTRICTED_PREFIXES = ['com.apple.developer.icloud', 'aps-environment',
                                 'get-task-allow', 'com.apple.developer.team-identifier']
          with open('Resources/release.entitlements', 'rb') as f:
              ents = plistlib.load(f)
          safe = {k: v for k, v in ents.items()
                  if not any(k.startswith(p) for p in RESTRICTED_PREFIXES)}
          with open('/tmp/ci-entitlements.plist', 'wb') as f:
              plistlib.dump(safe, f)
          print(f'CI entitlements: {list(safe.keys())}')
          "
          
          echo "==> Signing framework binaries (no app entitlements)..."
          find "$APP_DIR/Contents/Frameworks" -type f -perm +111 | while read -r binary; do
            if file "$binary" | grep -q "Mach-O"; then
              echo "  Signing: $binary"
              codesign --force --sign - --options runtime --timestamp=none "$binary" || true
            fi
          done
          
          find "$APP_DIR/Contents/Frameworks" -name "*.xpc" -o -name "*.app" | while read -r bundle; do
            if [ -d "$bundle" ]; then
              echo "  Signing bundle: $bundle"
              codesign --force --sign - --options runtime --timestamp=none "$bundle" || true
            fi
          done
          
          find "$APP_DIR/Contents/Frameworks" -name "*.framework" | while read -r fw; do
            echo "  Signing framework: $fw"
            codesign --force --sign - --options runtime --timestamp=none "$fw" || true
          done
          
          echo "==> Signing main binary with CI entitlements..."
          codesign --force --sign - --options runtime --timestamp=none \
            --entitlements /tmp/ci-entitlements.plist \
            "$APP_DIR/Contents/MacOS/PastaApp"
          
          echo "==> Signing app bundle..."
          codesign --force --sign - --options runtime --timestamp=none \
            --entitlements /tmp/ci-entitlements.plist \
            "$APP_DIR"
          
          codesign --verify --verbose=2 "$APP_DIR"
          
          # Verify entitlements are NOT on framework binaries
          SPARKLE_ENTS=$(codesign -d --entitlements - "$APP_DIR/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" 2>&1 || true)
          if echo "$SPARKLE_ENTS" | grep -q "icloud"; then
            echo "ERROR: Sparkle binary has iCloud entitlements — this will crash at launch!"
            exit 1
          fi
          echo "✓ Framework entitlements are clean"
      
      - name: Verify bundle structure
        if: env.FULL == 'true'
        run: |
          set -e
          APP_DIR="${{ steps.bundle.outputs.APP_DIR }}"
          
          echo "==> Verifying bundle structure..."
          
          # Check binary exists
          if [ ! -f "$APP_DIR/Contents/MacOS/PastaApp" ]; then
            echo "ERROR: Binary not found!"
            exit 1
          fi
          echo "✓ Binary exists"
          
          # Check Sparkle framework
          if [ ! -d "$APP_DIR/Contents/Frameworks/Sparkle.framework" ]; then
            echo "ERROR: Sparkle.framework not found!"
            exit 1
          fi
          echo "✓ Sparkle.framework exists"
          
          # Check rpath
          echo "==> Verifying rpath:"
          if ! otool -l "$APP_DIR/Contents/MacOS/PastaApp" | grep -A2 LC_RPATH | grep -q "@executable_path/../Frameworks"; then
            echo "ERROR: rpath not set correctly!"
            otool -l "$APP_DIR/Contents/MacOS/PastaApp" | grep -A2 LC_RPATH
            exit 1
          fi
          echo "✓ rpath OK"
      
      # Shared with release.yml (pre- and post-publish, on the notarized bundle)
      # so the smoke test users' builds get is byte-for-byte the one main gets.
      # Waits for the PASTA_CI_READY marker (see Sources/PastaApp/CIReadiness.swift),
      # then SIGTERM must exit 0.
      - name: Launch smoke test
        if: env.FULL == 'true'
        run: scripts/ci-launch-smoke.sh "${{ steps.bundle.outputs.APP_DIR }}"

  # Every step below is a subcommand of scripts/ci-ios-e2e.sh, which
  # release-ios.yml's `preflight` job runs identically before any TestFlight
  # upload. Change the script, not the steps, so the two cannot drift.
  # Heavy suite: main pushes, manual runs and routed pull requests only.
  ios-e2e:
    name: iOS E2E (XCUITest)
    needs: landing-changes
    if: needs.landing-changes.outputs.full == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.PASTA_NATIVE_RUNNER || 'pasta-local') || 'macos-15' }}
    timeout-minutes: 45
    env:
      PROJECT: PastaIOS/PastaIOS.xcodeproj
      SCHEME: PastaIOS
      DERIVED_DATA: .build/ios-derived
      RESULT_BUNDLE: .build/ios-e2e/PastaIOSUITests.xcresult
      DIAG_DIR: .build/ios-e2e/diagnostics
      SIM_NAME: PastaCI iPhone

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        if: runner.name != 'bravo-mini-pasta'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'

      - name: Verify local Xcode
        if: runner.environment == 'self-hosted'
        run: xcodebuild -version

      - name: Cache SwiftPM checkouts and build intermediates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ios-derived/SourcePackages
            .build/ios-derived/Build/Intermediates.noindex
          key: ios-e2e-${{ runner.os }}-${{ hashFiles('Package.resolved', 'PastaIOS/PastaIOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Package.swift', 'PastaIOS/PastaIOS.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ios-e2e-${{ runner.os }}-

      - name: Create iPhone simulator
        run: scripts/ci-ios-e2e.sh create-simulator

      - name: Resolve Swift packages
        run: scripts/ci-ios-e2e.sh resolve

      - name: Build for testing
        run: scripts/ci-ios-e2e.sh build-for-testing

      - name: Run XCUITests
        run: scripts/ci-ios-e2e.sh test

      - name: Summarise results
        if: always()
        run: scripts/ci-ios-e2e.sh summarise

      - name: Collect crash logs and simulator log on failure
        if: failure()
        run: scripts/ci-ios-e2e.sh diagnostics

      - name: Upload result bundle and diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-e2e-diagnostics
          path: |
            .build/ios-e2e/PastaIOSUITests.xcresult
            .build/ios-e2e/diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Shut down simulator
        if: always()
        run: scripts/ci-ios-e2e.sh cleanup

  # ============================================================================
  # CI GATE: one always-reported check over every suite on every surface:
  # macOS build+tests (+ bundle launch smoke when routed), iOS XCUITests, the
  # appcast/Cloudflare contract, path detection, and the landing-page Playwright
  # suite whenever it was relevant.
  # - On main pushes and manual runs every suite must succeed; nothing may be
  #   skipped except Playwright when path detection proved the landing page
  #   untouched on a push. Alpha and every publisher consume only such runs.
  # - On a pull request the iOS suite (and the launch-smoke steps inside
  #   Build & Test) may be skipped only when routing said the heavy suites
  #   were not needed; they then run on main after the merge.
  # Because this job always runs, it is the REQUIRED status check on main (a
  # skipped check never reports); scripts/owner-require-status-checks.sh
  # installs the ruleset.
  # ============================================================================
  ci-gate:
    name: CI gate
    needs: [test, ios-e2e, appcast-contract, landing-changes, landing-e2e]
    if: ${{ always() }}
    # Keep fork PR code on hosted runners; trusted jobs use the dedicated Linux host.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64","omarchy-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate every gate
        env:
          TEST: ${{ needs.test.result }}
          IOS: ${{ needs.ios-e2e.result }}
          APPCAST: ${{ needs.appcast-contract.result }}
          LANDING_CHANGES: ${{ needs.landing-changes.result }}
          LANDING_TOUCHED: ${{ needs.landing-changes.outputs.landing }}
          FULL: ${{ needs.landing-changes.outputs.full }}
          LANDING_E2E: ${{ needs.landing-e2e.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          ok=true
          row() { printf '| %s | %s | %s |\n' "$1" "$2" "$3" >> "$GITHUB_STEP_SUMMARY"; }
          { echo "## CI gate"; echo; echo "| Gate | Result | Verdict |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          for pair in "Build & Test:$TEST" "Appcast & Cloudflare config contract:$APPCAST" "Detect landing page changes:$LANDING_CHANGES"; do
            name="${pair%%:*}"; result="${pair##*:}"
            if [ "$result" = "success" ]; then row "$name" "$result" "✅"; else row "$name" "$result" "❌"; ok=false; fi
          done
          case "$IOS" in
            success) row "iOS E2E (XCUITest)" "success" "✅" ;;
            skipped)
              if [ "$EVENT" = "pull_request" ] && [ "$LANDING_CHANGES" = "success" ] && [ "$FULL" != "true" ]; then
                row "iOS E2E (XCUITest)" "skipped (deferred to main after merge)" "✅"
              else
                row "iOS E2E (XCUITest)" "skipped although it was required" "❌"; ok=false
              fi ;;
            *) row "iOS E2E (XCUITest)" "$IOS" "❌"; ok=false ;;
          esac
          if [ "$FULL" = "true" ]; then
            row "macOS bundle launch smoke" "ran inside Build & Test" "✅"
          else
            row "macOS bundle launch smoke" "deferred to main after merge" "✅"
          fi
          case "$LANDING_E2E" in
            success) row "Landing page e2e (Playwright)" "success" "✅" ;;
            skipped)
              if [ "$LANDING_TOUCHED" != "true" ] && [ "$EVENT" != "workflow_dispatch" ]; then
                row "Landing page e2e (Playwright)" "skipped (landing page untouched)" "✅"
              else
                row "Landing page e2e (Playwright)" "skipped although it was relevant" "❌"; ok=false
              fi ;;
            *) row "Landing page e2e (Playwright)" "$LANDING_E2E" "❌"; ok=false ;;
          esac
          if [ "$ok" = "true" ]; then
            echo "All gates green."
          else
            echo "::error::CI gate: at least one release gate is not green (see the job summary). Fix the red suite; never bypass it."
            exit 1
          fi

  # Alpha Release (alpha-release.yml) consumes only completed, successful
  # main push runs of this workflow, which always include every suite. A red
  # main run instead opens an issue (main-ci-responder.yml). Stable is
  # owner-approved (publish-stable.yml) and re-verifies this evidence.
