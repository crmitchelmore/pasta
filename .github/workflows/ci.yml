name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs exist for the landing page jobs below (e.g. to re-run the
  # advisory live probe after a release). Note that a manual run also executes
  # the macOS "Build & Test" job.
  workflow_dispatch:

jobs:
  # ============================================================================
  # LANDING PAGE / UPDATE SURFACE (cheap ubuntu jobs; see landing-page/README.md)
  # ============================================================================

  # Runs on EVERY push/PR: releases rewrite appcast.xml, and a malformed feed
  # silently breaks Sparkle auto-updates for every installed copy of the app.
  appcast-contract:
    name: Appcast & Cloudflare config contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        run: npm ci

      - name: Contract checks (appcast.xml, _redirects, _headers)
        working-directory: landing-page
        run: npm run test:contract

  # Detect whether the landing page surface changed so the browser suite only
  # runs when it can possibly be affected.
  landing-changes:
    name: Detect landing page changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            landing:
              - 'landing-page/**'
              - 'scripts/generate-appcast.sh'
              - '.github/workflows/ci.yml'

  landing-e2e:
    name: Landing page e2e (Playwright)
    needs: landing-changes
    if: github.event_name == 'workflow_dispatch' || needs.landing-changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        run: npm ci

      - name: Install Chromium
        working-directory: landing-page
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke suite
        working-directory: landing-page
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            landing-page/playwright-report/
            landing-page/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ADVISORY: probes the live site (pasta-app.com, GitHub release assets).
  # continue-on-error keeps a CDN/GitHub hiccup from ever blocking a merge; a red
  # run here is a prompt to look, not a broken build. Main pushes + manual only.
  landing-live-probe:
    name: Landing page live probe (advisory)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        run: npm ci

      - name: Probe https://pasta-app.com
        working-directory: landing-page
        run: npm run test:live

  # ============================================================================
  # MACOS APP
  # ============================================================================

  test:
    name: Build & Test
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Resolve Swift dependencies
        run: swift package resolve
      
      - name: Build
        run: swift build -c debug
      
      - name: Run tests
        run: swift test --parallel

      - name: Test release-notes generator
        run: node --test Tests/ReleaseNotesTests/*.test.mjs
      
      - name: Build release
        run: swift build -c release
      
      - name: Create test app bundle (mirrors release workflow)
        id: bundle
        run: |
          set -e
          echo "==> Creating test app bundle (same as release workflow)..."
          
          APP_DIR=".build/test-bundle/Pasta.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Frameworks"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          # Copy binary
          cp .build/release/PastaApp "$APP_DIR/Contents/MacOS/PastaApp"
          echo "==> Copied binary"
          
          # Copy Sparkle framework (same as release.yml)
          SPARKLE_PATH=$(find .build -name "Sparkle.framework" -type d | head -1)
          if [ -z "$SPARKLE_PATH" ]; then
            echo "ERROR: Sparkle.framework not found!"
            exit 1
          fi
          cp -R "$SPARKLE_PATH" "$APP_DIR/Contents/Frameworks/"
          echo "==> Copied Sparkle from $SPARKLE_PATH"
          
          # Fix rpath (same as release.yml)
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_DIR/Contents/MacOS/PastaApp"
          
          # Create minimal Info.plist
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Pasta</string>
              <key>CFBundleIdentifier</key>
              <string>com.pasta.clipboard.test</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>0.0.0</string>
              <key>CFBundleExecutable</key>
              <string>PastaApp</string>
              <key>LSUIElement</key>
              <true/>
              <key>SUFeedURL</key>
              <string>https://example.com/appcast.xml</string>
          </dict>
          </plist>
          PLIST
          
          echo "APP_DIR=$APP_DIR" >> $GITHUB_OUTPUT
          echo "==> Test bundle created"
      
      - name: Validate release entitlements
        run: |
          # These entitlements cause SIGKILL on launch if not in provisioning profile
          RESTRICTED_KEYS="aps-environment get-task-allow com.apple.developer.team-identifier"
          
          for key in $RESTRICTED_KEYS; do
            if grep -q "<key>${key}</key>" "Resources/release.entitlements"; then
              echo "ERROR: release.entitlements contains restricted key '${key}'."
              echo "This will cause 'The application can't be opened' on user machines."
              echo "Remove it or update the provisioning profile first."
              exit 1
            fi
          done
          echo "✓ No restricted entitlements found"
      
      - name: Sign test bundle (mirrors release signing)
        run: |
          set -e
          APP_DIR="${{ steps.bundle.outputs.APP_DIR }}"
          
          # CI uses ad-hoc signing (no Developer ID cert).
          # iCloud entitlements are restricted and require a provisioning profile,
          # so we strip them for the launch test. The entitlement validation step
          # above catches restricted keys statically.
          
          # Create CI-safe entitlements (non-restricted keys only)
          python3 -c "
          import plistlib, sys
          RESTRICTED_PREFIXES = ['com.apple.developer.icloud', 'aps-environment',
                                 'get-task-allow', 'com.apple.developer.team-identifier']
          with open('Resources/release.entitlements', 'rb') as f:
              ents = plistlib.load(f)
          safe = {k: v for k, v in ents.items()
                  if not any(k.startswith(p) for p in RESTRICTED_PREFIXES)}
          with open('/tmp/ci-entitlements.plist', 'wb') as f:
              plistlib.dump(safe, f)
          print(f'CI entitlements: {list(safe.keys())}')
          "
          
          echo "==> Signing framework binaries (no app entitlements)..."
          find "$APP_DIR/Contents/Frameworks" -type f -perm +111 | while read binary; do
            if file "$binary" | grep -q "Mach-O"; then
              echo "  Signing: $binary"
              codesign --force --sign - --options runtime --timestamp=none "$binary" || true
            fi
          done
          
          find "$APP_DIR/Contents/Frameworks" -name "*.xpc" -o -name "*.app" | while read bundle; do
            if [ -d "$bundle" ]; then
              echo "  Signing bundle: $bundle"
              codesign --force --sign - --options runtime --timestamp=none "$bundle" || true
            fi
          done
          
          find "$APP_DIR/Contents/Frameworks" -name "*.framework" | while read fw; do
            echo "  Signing framework: $fw"
            codesign --force --sign - --options runtime --timestamp=none "$fw" || true
          done
          
          echo "==> Signing main binary with CI entitlements..."
          codesign --force --sign - --options runtime --timestamp=none \
            --entitlements /tmp/ci-entitlements.plist \
            "$APP_DIR/Contents/MacOS/PastaApp"
          
          echo "==> Signing app bundle..."
          codesign --force --sign - --options runtime --timestamp=none \
            --entitlements /tmp/ci-entitlements.plist \
            "$APP_DIR"
          
          codesign --verify --verbose=2 "$APP_DIR"
          
          # Verify entitlements are NOT on framework binaries
          SPARKLE_ENTS=$(codesign -d --entitlements - "$APP_DIR/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" 2>&1 || true)
          if echo "$SPARKLE_ENTS" | grep -q "icloud"; then
            echo "ERROR: Sparkle binary has iCloud entitlements — this will crash at launch!"
            exit 1
          fi
          echo "✓ Framework entitlements are clean"
      
      - name: Verify bundle structure
        run: |
          set -e
          APP_DIR="${{ steps.bundle.outputs.APP_DIR }}"
          
          echo "==> Verifying bundle structure..."
          
          # Check binary exists
          if [ ! -f "$APP_DIR/Contents/MacOS/PastaApp" ]; then
            echo "ERROR: Binary not found!"
            exit 1
          fi
          echo "✓ Binary exists"
          
          # Check Sparkle framework
          if [ ! -d "$APP_DIR/Contents/Frameworks/Sparkle.framework" ]; then
            echo "ERROR: Sparkle.framework not found!"
            exit 1
          fi
          echo "✓ Sparkle.framework exists"
          
          # Check rpath
          echo "==> Verifying rpath:"
          if ! otool -l "$APP_DIR/Contents/MacOS/PastaApp" | grep -A2 LC_RPATH | grep -q "@executable_path/../Frameworks"; then
            echo "ERROR: rpath not set correctly!"
            otool -l "$APP_DIR/Contents/MacOS/PastaApp" | grep -A2 LC_RPATH
            exit 1
          fi
          echo "✓ rpath OK"
      
      - name: Launch smoke test
        run: |
          set -e
          APP_DIR="${{ steps.bundle.outputs.APP_DIR }}"
          READY_FILE="$RUNNER_TEMP/pasta-ci-ready"
          LAUNCH_LOG=/tmp/launch_error.log
          rm -f "$READY_FILE" "$LAUNCH_LOG"

          dump_logs() {
            echo "==> App stderr ($LAUNCH_LOG):"
            cat "$LAUNCH_LOG" 2>/dev/null || true
            echo ""
            echo "==> App os_log (errors, AppKit termination, Sparkle) — last 90s:"
            log show --last 90s --style compact \
              --predicate 'process == "PastaApp" AND (messageType == error OR messageType == fault OR subsystem == "com.apple.AppKit" OR subsystem CONTAINS "sparkle" OR subsystem CONTAINS "pasta")' \
              2>/dev/null | tail -60 || true
            echo ""
            echo "==> System log (AMFI/codesign):"
            log show --last 90s --predicate 'process == "amfid" OR process == "syspolicyd" OR subsystem == "com.apple.MobileFileIntegrity"' 2>/dev/null | tail -20 || true
          }

          echo "==> Smoke test: launching signed app bundle..."

          # PASTA_CI disables CloudKit init and analytics, makes BackgroundService
          # emit `PASTA_CI_READY` (stderr + PASTA_CI_READY_FILE) once the database
          # has answered the initial history load and clipboard monitoring is
          # running, and routes SIGTERM through NSApplication.terminate.
          PASTA_CI=1 PASTA_CI_READY_FILE="$READY_FILE" \
            "$APP_DIR/Contents/MacOS/PastaApp" 2> "$LAUNCH_LOG" &
          APP_PID=$!

          # 1. Wait (<= 20s) for the app to prove it initialised, not just that it has a PID.
          READY=0
          for _ in $(seq 1 40); do
            if [ -f "$READY_FILE" ] || grep -q "PASTA_CI_READY" "$LAUNCH_LOG" 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          if [ "$READY" != "1" ]; then
            if kill -0 $APP_PID 2>/dev/null; then
              echo "ERROR: App is running (PID $APP_PID) but never reported PASTA_CI_READY within 20s."
              echo "       Database open / initial history load / clipboard monitor start did not complete."
              kill -KILL $APP_PID 2>/dev/null || true
              wait $APP_PID 2>/dev/null || true
            else
              EXIT_CODE=0
              wait $APP_PID 2>/dev/null || EXIT_CODE=$?
              echo "ERROR: App exited before becoming ready (exit code $EXIT_CODE)."
            fi
            dump_logs
            exit 1
          fi
          echo "✓ App initialised: $(cat "$READY_FILE" 2>/dev/null || grep PASTA_CI_READY "$LAUNCH_LOG")"

          # 2. Graceful quit must exit 0 — a crash on teardown is a regression too.
          echo "==> Sending SIGTERM (routed to NSApplication.terminate under PASTA_CI)..."
          kill -TERM $APP_PID
          ( sleep 15; kill -KILL $APP_PID 2>/dev/null ) &
          WATCHDOG_PID=$!
          EXIT_CODE=0
          wait $APP_PID || EXIT_CODE=$?
          kill $WATCHDOG_PID 2>/dev/null || true

          if [ "$EXIT_CODE" != "0" ]; then
            if [ "$EXIT_CODE" = "137" ]; then
              echo "ERROR: App did not quit within 15s of SIGTERM (killed by watchdog)."
            else
              echo "ERROR: App exited with code $EXIT_CODE on quit (expected 0)."
            fi
            dump_logs
            exit 1
          fi
          echo "✓ App quit cleanly (exit 0)"

          echo "==> Smoke test PASSED!"

  ios-e2e:
    name: iOS E2E (XCUITest)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PROJECT: PastaIOS/PastaIOS.xcodeproj
      SCHEME: PastaIOS
      DERIVED_DATA: .build/ios-derived
      RESULT_BUNDLE: .build/ios-e2e/PastaIOSUITests.xcresult
      DIAG_DIR: .build/ios-e2e/diagnostics
      SIM_NAME: PastaCI iPhone

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM checkouts and build intermediates
        uses: actions/cache@v4
        with:
          path: |
            .build/ios-derived/SourcePackages
            .build/ios-derived/Build/Intermediates.noindex
          key: ios-e2e-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift', 'PastaIOS/PastaIOS.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ios-e2e-${{ runner.os }}-

      - name: Create iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          # The XCUITest keyboard needs the software keyboard; a "connected"
          # hardware keyboard makes typeText fail with no keyboard focus.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rts.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          print(rts[-1]["identifier"])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          types = json.load(sys.stdin)["devicetypes"]
          for wanted in ("iPhone 17", "iPhone 16", "iPhone 16e", "iPhone 15"):
              for t in types:
                  if t["name"] == wanted:
                      print(t["identifier"]); sys.exit(0)
          print(types[0]["identifier"])')
          echo "==> Runtime: $RUNTIME"
          echo "==> Device type: $DEVICE_TYPE"
          UDID=$(xcrun simctl create "$SIM_NAME" "$DEVICE_TYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "==> Booted $SIM_NAME ($UDID)"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee .build/ios-e2e-build.log | grep -E "^(=== |\*\* |error:|.*error:|.*warning: .*PastaIOS)" || true
          # tee swallows the exit status through grep; re-check the summary line.
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" .build/ios-e2e-build.log

      - name: Run XCUITests
        id: test
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$RESULT_BUNDLE")"
          xcodebuild test-without-building \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -retry-tests-on-failure -test-iterations 2 \
            2>&1 | tee .build/ios-e2e-test.log \
            | grep -E "Test Case|Test Suite|passed|failed|error|Executed|Restarting|crash" || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" .build/ios-e2e-test.log

      - name: Summarise results
        if: always()
        run: |
          set +e
          mkdir -p "$DIAG_DIR"
          if [ ! -d "$RESULT_BUNDLE" ]; then
            echo "No result bundle produced at $RESULT_BUNDLE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" > "$DIAG_DIR/xcresult-summary.json" 2>/dev/null
          xcrun xcresulttool get test-results tests   --path "$RESULT_BUNDLE" > "$DIAG_DIR/xcresult-tests.json"   2>/dev/null
          python3 - "$DIAG_DIR/xcresult-summary.json" "$DIAG_DIR/xcresult-tests.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys

          def load(path):
              try:
                  with open(path) as fh:
                      return json.load(fh)
              except Exception as exc:
                  print(f"(could not read {path}: {exc})")
                  return {}

          summary, tests = load(sys.argv[1]), load(sys.argv[2])
          print("## iOS E2E results")
          result = summary.get("result", "unknown")
          print(f"- Result: **{result}** — passed {summary.get('passedTests', '?')}, "
                f"failed {summary.get('failedTests', '?')}, skipped {summary.get('skippedTests', '?')}")
          for failure in summary.get("testFailures", []):
              text = (failure.get("failureText") or "").splitlines()
              first = text[0] if text else ""
              print(f"- FAILED `{failure.get('testName')}`: {first}")
          print()
          print("```")

          def walk(nodes, depth=0):
              for node in nodes:
                  kind = node.get("nodeType", "")
                  if kind in ("Test Case", "Test Suite", "Unit test bundle", "UI test bundle"):
                      res = node.get("result", "")
                      print("  " * depth + f"{res:<8} {node.get('name', '')} {node.get('duration', '')}")
                  walk(node.get("children", []), depth + 1)

          walk(tests.get("testNodes", []))
          print("```")
          PY

      - name: Collect crash logs and simulator log on failure
        if: failure()
        run: |
          set +e
          mkdir -p "$DIAG_DIR"
          UDID="${{ steps.sim.outputs.udid }}"

          echo "==> Crash reports (host DiagnosticReports)"
          for dir in "$HOME/Library/Logs/DiagnosticReports" "/Library/Logs/DiagnosticReports"; do
            find "$dir" -maxdepth 1 \( -name 'PastaIOS*' -o -name 'PastaIOSUITests*' -o -name 'xctest*' \) \
              -newer "$PROJECT/project.pbxproj" -exec cp -v {} "$DIAG_DIR/" \; 2>/dev/null
          done
          # Simulator-side crash reports live under the device's data directory.
          if [ -n "$UDID" ]; then
            SIM_DATA="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data"
            for sub in Library/Logs/DiagnosticReports Library/Logs/CrashReporter; do
              [ -d "$SIM_DATA/$sub" ] && find "$SIM_DATA/$sub" -type f -exec cp -v {} "$DIAG_DIR/" \; 2>/dev/null
            done
          fi

          echo "==> Print any crash headers we found"
          for f in "$DIAG_DIR"/*.ips "$DIAG_DIR"/*.crash; do
            [ -f "$f" ] || continue
            echo "----- $f"
            grep -E '"procName"|"exception"|"termination"|Exception Type|Termination Reason|Crashed:' "$f" | head -20
          done

          echo "==> Simulator unified log for PastaIOS (last 20 minutes)"
          if [ -n "$UDID" ]; then
            xcrun simctl spawn "$UDID" log show --last 20m --style compact \
              --predicate 'process == "PastaIOS" OR (process == "SpringBoard" AND eventMessage CONTAINS "PastaIOS") OR eventMessage CONTAINS "com.pasta.ios"' \
              > "$DIAG_DIR/simulator-pastaios.log" 2>&1
            xcrun simctl spawn "$UDID" log show --last 20m --style compact \
              --predicate 'eventMessage CONTAINS "crash" OR process == "ReportCrash" OR process == "osanalyticshelper"' \
              > "$DIAG_DIR/simulator-crash-reporter.log" 2>&1
            tail -50 "$DIAG_DIR/simulator-pastaios.log"
          fi

          echo "==> Test failures from the result bundle"
          python3 - "$DIAG_DIR/xcresult-summary.json" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1]) as fh:
                  summary = json.load(fh)
          except Exception:
              raise SystemExit(0)
          for failure in summary.get("testFailures", []):
              print("FAILED", failure.get("testName"))
              print(failure.get("failureText"))
              print()
          PY
          cp .build/ios-e2e-build.log .build/ios-e2e-test.log "$DIAG_DIR/" 2>/dev/null
          ls -la "$DIAG_DIR"

      - name: Upload result bundle and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-diagnostics
          path: |
            .build/ios-e2e/PastaIOSUITests.xcresult
            .build/ios-e2e/diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Shut down simulator
        if: always()
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" 2>/dev/null || true
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" 2>/dev/null || true

  auto-release:
    name: Auto Version & Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_RELEASE_TOKEN }}
      
      - name: Determine version bump from conventional commits
        id: bump
        run: |
          set -e
          
          # Get latest tag
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"
          
          # Get commit messages since last tag (subject lines only)
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          
          if [ -z "$COMMITS" ]; then
            echo "No new commits since $LATEST_TAG"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"
          echo "---"
          
          # Also check commit bodies for BREAKING CHANGE
          BODIES=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%b" --no-merges)
          
          # Determine bump type from conventional commits
          BUMP="none"
          
          # Check for breaking changes: "type!:" prefix or "BREAKING CHANGE:" in body
          if echo "$COMMITS" | grep -qE "^[a-z]+(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$BODIES" | grep -qE "^BREAKING CHANGE:"; then
            BUMP="major"
          # Check for features
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          # Check for fixes and performance improvements
          elif echo "$COMMITS" | grep -qE "^(fix|perf)(\(.+\))?:"; then
            BUMP="patch"
          fi
          
          if [ "$BUMP" = "none" ]; then
            echo "No releasable conventional commits (feat/fix/perf/breaking) found"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Parse current version and apply bump
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Version bump: $BUMP ($LATEST_TAG → $NEW_TAG)"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
      
      - name: Create and push tag
        if: steps.bump.outputs.skip != 'true'
        run: |
          NEW_TAG="${{ steps.bump.outputs.new_tag }}"
          
          # Check if tag already exists
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping"
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
