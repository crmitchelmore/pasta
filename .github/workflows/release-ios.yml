name: Release iOS (TestFlight)
permissions:
  contents: write
  actions: read
concurrency:
  group: release-ios
  cancel-in-progress: false
  queue: max
env:
  PROJECT: PastaIOS/PastaIOS.xcodeproj
  SCHEME: PastaIOS
  BUNDLE_ID: com.pasta.ios
  ICLOUD_CONTAINER: iCloud.com.pasta.ios
  BUILD_NUMBER_BASE: 100
  BUILD_DIR: build
  ARCHIVE_PATH: build/PastaIOS.xcarchive
  EXPORT_PATH: build/export
  GH_TOKEN: ${{ github.token }}
jobs:
  preflight:
    name: "Preflight \u2014 iOS E2E (XCUITest)"
    runs-on: pasta-local
    timeout-minutes: 45
    env:
      DERIVED_DATA: .build/ios-derived
      RESULT_BUNDLE: .build/ios-e2e/PastaIOSUITests.xcresult
      DIAG_DIR: .build/ios-e2e/diagnostics
      SIM_NAME: PastaCI iPhone
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: ${{ inputs.manifest }}
    # Preflight runs the XCUITest suite on the pristine tagged source, exactly
    # as ci.yml's ios-e2e did for this commit. The frozen manifest is loaded and
    # stamped only in the testflight job below: `configure` replaces the bundled
    # IOSReleaseNotes.json with the train's own history, which removed the Stable
    # fixture entry the What's New UI test reads and failed every Alpha
    # preflight (alpha-build-1, run 34682319511).
    - name: Select Xcode
      if: runner.name != 'bravo-mini-pasta'
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
      with:
        xcode-version: '26.3'
    - name: Cache SwiftPM checkouts and build intermediates
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: '.build/ios-derived/SourcePackages

          .build/ios-derived/Build/Intermediates.noindex

          '
        key: ios-e2e-${{ runner.os }}-${{ hashFiles('Package.resolved', 'PastaIOS/PastaIOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved',
          'Package.swift', 'PastaIOS/PastaIOS.xcodeproj/project.pbxproj') }}
        restore-keys: 'ios-e2e-${{ runner.os }}-

          '
    - name: Create iPhone simulator
      run: scripts/ci-ios-e2e.sh create-simulator
    - name: Resolve Swift packages
      run: scripts/ci-ios-e2e.sh resolve
    - name: Build for testing
      run: scripts/ci-ios-e2e.sh build-for-testing
    - name: Run XCUITests
      run: scripts/ci-ios-e2e.sh test
    - name: Summarise results
      if: always()
      run: scripts/ci-ios-e2e.sh summarise
    - name: Collect crash logs and simulator log on failure
      if: failure()
      run: scripts/ci-ios-e2e.sh diagnostics
    - name: Upload result bundle and diagnostics
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-ios-preflight-diagnostics
        path: '.build/ios-e2e/PastaIOSUITests.xcresult

          .build/ios-e2e/diagnostics

          '
        if-no-files-found: warn
        retention-days: 14
    - name: Shut down simulator
      if: always()
      run: scripts/ci-ios-e2e.sh cleanup
  testflight:
    name: Archive, Export & Upload to TestFlight
    needs: preflight
    runs-on: pasta-local
    timeout-minutes: 90
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: ${{ inputs.manifest }}
    - name: Load frozen release manifest
      env:
        MANIFEST: ${{ inputs.manifest }}
      run: node scripts/release-train.mjs configure --tag "$MANIFEST" --surface ios
    - name: Stamp isolated release configuration
      run: python3 scripts/configure-release-train.py
    - name: Select Xcode
      if: runner.name != 'bravo-mini-pasta'
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
      with:
        xcode-version: '26.3'
    - name: Validate secrets
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
        IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        IOS_APPSTORE_PROFILE: ${{ env.RELEASE_TRAIN == 'alpha' && secrets.ALPHA_IOS_APPSTORE_PROFILE || secrets.IOS_APPSTORE_PROFILE
          }}
      run: "set -euo pipefail\nmissing=()\nfor name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY\
        \ \\\n            APPLE_TEAM_ID IOS_DISTRIBUTION_P12 IOS_DISTRIBUTION_PASSWORD IOS_APPSTORE_PROFILE; do\n  [ -n \"\
        ${!name}\" ] || missing+=(\"$name\")\ndone\nif [ ${#missing[@]} -gt 0 ]; then\n  echo \"::error::Missing required\
        \ repository secret(s): ${missing[*]}. See PastaIOS/DEPLOY.md for what each one is and how to create it.\"\n  exit\
        \ 1\nfi\nif [[ ! \"$APPLE_TEAM_ID\" =~ ^[A-Z0-9]{10}$ ]]; then\n  echo \"::error::APPLE_TEAM_ID must be a 10-character\
        \ Apple Team ID.\"\n  exit 1\nfi\nif [[ ! \"$APP_STORE_CONNECT_KEY_ID\" =~ ^[A-Z0-9]{10}$ ]]; then\n  echo \"::error::APP_STORE_CONNECT_KEY_ID\
        \ must be the 10-character key id shown in App Store Connect.\"\n  exit 1\nfi\nif [[ ! \"$APP_STORE_CONNECT_ISSUER_ID\"\
        \ =~ ^[0-9a-fA-F-]{36}$ ]]; then\n  echo \"::error::APP_STORE_CONNECT_ISSUER_ID must be the issuer UUID shown in App\
        \ Store Connect.\"\n  exit 1\nfi\necho \"==> All required secrets present\"\n"
    - name: Use frozen marketing version
      id: version
      run: echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
    - name: Use frozen build number
      id: build_number
      run: echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
    - name: Upload the manifest build
      id: upload
      run: echo "enabled=true" >> "$GITHUB_OUTPUT"
    - name: Install App Store Connect API key
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      run: "set -euo pipefail\n# xcodebuild receives this explicit path; leave personal keys untouched.\numask 077\nKEY_DIR=\"\
        $RUNNER_TEMP/asc-private-keys\"\nmkdir -p \"$KEY_DIR\"\nKEY_PATH=\"$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8\"\
        \nif ! printf '%s' \"$APP_STORE_CONNECT_API_KEY\" | base64 --decode > \"$KEY_PATH\" 2>/dev/null; then\n  echo \"::error::APP_STORE_CONNECT_API_KEY\
        \ is not valid base64. Store it with: base64 -i AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 | pbcopy\"\n  exit 1\nfi\n\
        chmod 600 \"$KEY_PATH\"\nif ! grep -q 'BEGIN PRIVATE KEY' \"$KEY_PATH\"; then\n  echo \"::error::Decoded APP_STORE_CONNECT_API_KEY\
        \ is not a PEM private key (.p8). Re-export it from App Store Connect.\"\n  exit 1\nfi\necho \"ASC_KEY_PATH=$KEY_PATH\"\
        \ >> \"$GITHUB_ENV\"\necho \"==> API key installed at $KEY_PATH\"\n"
    - name: Reuse existing manifest upload
      id: existing
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: ruby scripts/release-apple.rb upload-status "$RUNNER_TEMP/release-manifest.json" ios
    - name: Import distribution certificate and provisioning profile
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
        IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        IOS_APPSTORE_PROFILE: ${{ env.RELEASE_TRAIN == 'alpha' && secrets.ALPHA_IOS_APPSTORE_PROFILE || secrets.IOS_APPSTORE_PROFILE
          }}
      run: "set -euo pipefail\n\necho \"==> Creating temporary keychain\"\nKEYCHAIN_PATH=\"$RUNNER_TEMP/ios-signing.keychain-db\"\
        \nKEYCHAIN_PASSWORD=\"$(openssl rand -base64 32)\"\necho \"KEYCHAIN_PATH=$KEYCHAIN_PATH\" >> \"$GITHUB_ENV\"\nsecurity\
        \ create-keychain -p \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN_PATH\"\nsecurity set-keychain-settings -lut 21600 \"$KEYCHAIN_PATH\"\
        \nsecurity unlock-keychain -p \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN_PATH\"\npython3 scripts/ci-keychain-search.py add\
        \ \"$RUNNER_TEMP/keychain-search.json\" \"$KEYCHAIN_PATH\"\necho \"KEYCHAIN_PATH=$KEYCHAIN_PATH\" >> \"$GITHUB_ENV\"\
        \n\necho \"==> Importing Apple Distribution certificate\"\nCERT_PATH=\"$RUNNER_TEMP/ios-distribution.p12\"\nif ! printf\
        \ '%s' \"$IOS_DISTRIBUTION_P12\" | base64 --decode > \"$CERT_PATH\" 2>/dev/null; then\n  echo \"::error::IOS_DISTRIBUTION_P12\
        \ is not valid base64.\"\n  exit 1\nfi\nsecurity import \"$CERT_PATH\" -k \"$KEYCHAIN_PATH\" -P \"$IOS_DISTRIBUTION_PASSWORD\"\
        \ \\\n  -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild\nsecurity set-key-partition-list -S apple-tool:,apple:,codesign:\
        \ -s -k \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN_PATH\" >/dev/null\nrm -f \"$CERT_PATH\"\nif ! security find-identity -v\
        \ -p codesigning \"$KEYCHAIN_PATH\" | grep -q \"Apple Distribution\"; then\n  echo \"::error::IOS_DISTRIBUTION_P12\
        \ does not contain an 'Apple Distribution' identity (see PastaIOS/DEPLOY.md for how to export one).\"\n  security\
        \ find-identity -v -p codesigning \"$KEYCHAIN_PATH\" || true\n  exit 1\nfi\n\necho \"==> Installing App Store provisioning\
        \ profile\"\nPROFILE_DIR=\"$HOME/Library/MobileDevice/Provisioning Profiles\"\nmkdir -p \"$PROFILE_DIR\"\nPROFILE_TMP=\"\
        $RUNNER_TEMP/ios-appstore.mobileprovision\"\nif ! printf '%s' \"$IOS_APPSTORE_PROFILE\" | base64 --decode > \"$PROFILE_TMP\"\
        \ 2>/dev/null; then\n  echo \"::error::IOS_APPSTORE_PROFILE is not valid base64.\"\n  exit 1\nfi\nPROFILE_PLIST=\"\
        $RUNNER_TEMP/ios-appstore.plist\"\nsecurity cms -D -i \"$PROFILE_TMP\" > \"$PROFILE_PLIST\"\nPROFILE_UUID=\"$(plutil\
        \ -extract UUID raw -o - \"$PROFILE_PLIST\")\"\nPROFILE_NAME=\"$(plutil -extract Name raw -o - \"$PROFILE_PLIST\"\
        )\"\nPROFILE_TEAM=\"$(plutil -extract TeamIdentifier.0 raw -o - \"$PROFILE_PLIST\")\"\nPROFILE_APP_ID=\"$(plutil -extract\
        \ Entitlements.application-identifier raw -o - \"$PROFILE_PLIST\")\"\nPROFILE_EXPIRY=\"$(plutil -extract ExpirationDate\
        \ raw -o - \"$PROFILE_PLIST\")\"\n\nif [ \"$PROFILE_TEAM\" != \"$APPLE_TEAM_ID\" ]; then\n  echo \"::error::IOS_APPSTORE_PROFILE\
        \ belongs to team '$PROFILE_TEAM', but APPLE_TEAM_ID is '$APPLE_TEAM_ID'.\"\n  exit 1\nfi\nif [ \"$PROFILE_APP_ID\"\
        \ != \"${APPLE_TEAM_ID}.${BUNDLE_ID}\" ]; then\n  echo \"::error::IOS_APPSTORE_PROFILE is for '$PROFILE_APP_ID', expected\
        \ '${APPLE_TEAM_ID}.${BUNDLE_ID}'.\"\n  exit 1\nfi\nif plutil -extract ProvisionedDevices raw -o - \"$PROFILE_PLIST\"\
        \ >/dev/null 2>&1; then\n  echo \"::error::IOS_APPSTORE_PROFILE lists provisioned devices, so it is a development/ad-hoc\
        \ profile, not an App Store profile.\"\n  exit 1\nfi\nEXPIRY_EPOCH=\"$(date -j -f '%Y-%m-%dT%H:%M:%SZ' \"$PROFILE_EXPIRY\"\
        \ +%s 2>/dev/null || echo 0)\"\nif [ \"$EXPIRY_EPOCH\" -gt 0 ] && [ \"$EXPIRY_EPOCH\" -lt \"$(date +%s)\" ]; then\n\
        \  echo \"::error::IOS_APPSTORE_PROFILE '$PROFILE_NAME' expired on $PROFILE_EXPIRY. Regenerate it in the Apple Developer\
        \ portal.\"\n  exit 1\nfi\nif ! plutil -extract Entitlements xml1 -o - \"$PROFILE_PLIST\" | grep -q \"<string>${ICLOUD_CONTAINER}</string>\"\
        ; then\n  echo \"::error::Profile '$PROFILE_NAME' does not grant the ${ICLOUD_CONTAINER} iCloud container. Enable\
        \ iCloud/CloudKit on the ${BUNDLE_ID} App ID, regenerate the App Store profile and update IOS_APPSTORE_PROFILE.\"\n\
        \  exit 1\nfi\nif ! plutil -extract Entitlements.aps-environment raw -o - \"$PROFILE_PLIST\" >/dev/null 2>&1; then\n\
        \  echo \"::error::Profile '$PROFILE_NAME' does not grant aps-environment. Enable Push Notifications on the ${BUNDLE_ID}\
        \ App ID and regenerate the profile.\"\n  exit 1\nfi\n\nif [ -f \"$PROFILE_DIR/${PROFILE_UUID}.mobileprovision\" ];\
        \ then\n  cp -p \"$PROFILE_DIR/${PROFILE_UUID}.mobileprovision\" \"$RUNNER_TEMP/original.mobileprovision\"\nfi\necho\
        \ \"PROFILE_UUID=$PROFILE_UUID\" >> \"$GITHUB_ENV\"\ncp \"$PROFILE_TMP\" \"$PROFILE_DIR/${PROFILE_UUID}.mobileprovision\"\
        \nrm -f \"$PROFILE_TMP\"\necho \"PROFILE_UUID=$PROFILE_UUID\" >> \"$GITHUB_ENV\"\necho \"PROFILE_NAME=$PROFILE_NAME\"\
        \ >> \"$GITHUB_ENV\"\necho \"==> Installed profile '$PROFILE_NAME' ($PROFILE_UUID), expires $PROFILE_EXPIRY\"\n"
      if: steps.existing.outputs.skip_upload != 'true'
    - name: Resolve Swift packages
      run: "set -euo pipefail\npython3 scripts/ci-verify-dependency-locks.py\nscripts/ci-xcodebuild.sh -resolvePackageDependencies\
        \ \\\n  -onlyUsePackageVersionsFromResolvedFile \\\n  -project \"$PROJECT\" \\\n  -scheme \"$SCHEME\" \\\n  -derivedDataPath\
        \ \"$BUILD_DIR/DerivedData\"\n"
      if: steps.existing.outputs.skip_upload != 'true'
    - name: Use frozen notes
      run: test -s "$RUNNER_TEMP/release-notes.md"
      if: steps.existing.outputs.skip_upload != 'true'
    - name: Archive PastaIOS
      env:
        VERSION: ${{ steps.version.outputs.version }}
        BUILD_NUMBER: ${{ steps.build_number.outputs.build }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: "set -euo pipefail\necho \"==> Archiving $SCHEME $VERSION ($BUILD_NUMBER) signed with project profile $PROFILE_NAME\"\
        \n# Archive SIGNED so CODE_SIGN_ENTITLEMENTS (iCloud, push) are baked in.\n# Do NOT pass target-specific settings\
        \ on the command line: a CLI\n# override applies to every target, including SwiftPM package targets.\n#   - PROVISIONING_PROFILE_SPECIFIER\
        \ would hit GRDB_GRDB, which rejects\n#     provisioning profiles.\n#   - SWIFT_ACTIVE_COMPILATION_CONDITIONS would\
        \ replace the SWIFT_PACKAGE\n#     define GRDB needs to import its SQLite shim (v1.5.9 failed with\n#     \"cannot\
        \ find '_registerErrorLogCallback' in scope\").\n# The project's Release configuration owns Manual / Apple Distribution,\n\
        # the \"PastaIOS AppStore CI\" profile name and the\n# PASTA_IOS_CLOUDKIT_PROVISIONED compile flag on the app target\
        \ only;\n# The host passes this approval explicitly into the shared SyncManager;\n# SwiftPM targets do not inherit\
        \ app compilation conditions.\n# scripts/ci-ios-e2e.sh asserts the app flag is present before upload.\nscripts/ci-xcodebuild.sh\
        \ archive \\\n  -onlyUsePackageVersionsFromResolvedFile \\\n  -project \"$PROJECT\" \\\n  -scheme \"$SCHEME\" \\\n\
        \  -configuration Release \\\n  -destination 'generic/platform=iOS' \\\n  -archivePath \"$ARCHIVE_PATH\" \\\n  -derivedDataPath\
        \ \"$BUILD_DIR/DerivedData\" \\\n  DEVELOPMENT_TEAM=\"$APPLE_TEAM_ID\" \\\n  MARKETING_VERSION=\"$VERSION\" \\\n \
        \ CURRENT_PROJECT_VERSION=\"$BUILD_NUMBER\" \\\n  OTHER_CODE_SIGN_FLAGS=\"--keychain $KEYCHAIN_PATH\" \\\n  2>&1 |\
        \ tee \"$BUILD_DIR/archive.log\"\n"
      if: steps.existing.outputs.skip_upload != 'true'
    - name: Verify archive metadata
      env:
        VERSION: ${{ steps.version.outputs.version }}
        BUILD_NUMBER: ${{ steps.build_number.outputs.build }}
      run: 'set -euo pipefail

        APP_PATH="$ARCHIVE_PATH/Products/Applications/PastaIOS.app"

        [ -d "$APP_PATH" ] || { echo "::error::Archive did not produce $APP_PATH"; exit 1; }


        ACTUAL_ID="$(/usr/libexec/PlistBuddy -c ''Print :CFBundleIdentifier'' "$APP_PATH/Info.plist")"

        ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c ''Print :CFBundleShortVersionString'' "$APP_PATH/Info.plist")"

        ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c ''Print :CFBundleVersion'' "$APP_PATH/Info.plist")"

        [ "$ACTUAL_ID" = "$BUNDLE_ID" ] || { echo "::error::Bundle id mismatch: expected $BUNDLE_ID, got $ACTUAL_ID"; exit
        1; }

        [ "$ACTUAL_VERSION" = "$VERSION" ] || { echo "::error::Version mismatch: expected $VERSION, got $ACTUAL_VERSION";
        exit 1; }

        [ "$ACTUAL_BUILD" = "$BUILD_NUMBER" ] || { echo "::error::Build mismatch: expected $BUILD_NUMBER, got $ACTUAL_BUILD";
        exit 1; }


        node scripts/verify-ios-release-notes.mjs "$APP_PATH" "$VERSION" "$BUILD_NUMBER" "$(git rev-parse HEAD)"


        codesign -d --entitlements - --xml "$APP_PATH" > "$RUNNER_TEMP/archive-entitlements.plist"

        python3 scripts/ci-verify-cloudkit-entitlements.py "$RUNNER_TEMP/archive-entitlements.plist"

        CONTAINER="$(/usr/libexec/PlistBuddy -c ''Print :com.apple.developer.icloud-container-identifiers:0'' "$RUNNER_TEMP/archive-entitlements.plist"
        2>/dev/null || true)"

        [ "$CONTAINER" = "$ICLOUD_CONTAINER" ] || { echo "::error::iCloud container mismatch in archive: expected $ICLOUD_CONTAINER,
        got ''${CONTAINER:-missing}''"; exit 1; }


        [ -d "$ARCHIVE_PATH/dSYMs/PastaIOS.app.dSYM" ] || echo "::warning::No dSYM found in archive; crash symbolication will
        be unavailable."

        echo "==> Archive OK: $ACTUAL_ID $ACTUAL_VERSION ($ACTUAL_BUILD), container $CONTAINER"

        '
      if: steps.existing.outputs.skip_upload != 'true'
    - name: Verify signed train archive
      run: python3 scripts/verify-release-train-archive.py "$ARCHIVE_PATH/Products/Applications/PastaIOS.app" "$RUNNER_TEMP/release-manifest.json"
        ios
      if: steps.existing.outputs.skip_upload != 'true'
    - name: Prepare export options
      env:
        UPLOAD: ${{ steps.upload.outputs.enabled }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: "set -euo pipefail\nOPTIONS=\"$BUILD_DIR/ExportOptions.plist\"\ncp PastaIOS/ExportOptions.plist \"$OPTIONS\"\n\
        /usr/libexec/PlistBuddy -c \"Set :teamID $APPLE_TEAM_ID\" \"$OPTIONS\"\n/usr/libexec/PlistBuddy -c \"Delete :provisioningProfiles\"\
        \ \"$OPTIONS\"\n/usr/libexec/PlistBuddy -c \"Add :provisioningProfiles dict\" \"$OPTIONS\"\n/usr/libexec/PlistBuddy\
        \ -c \"Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_UUID\" \"$OPTIONS\"\nif [ \"$UPLOAD\" = \"true\" ]; then\n\
        \  /usr/libexec/PlistBuddy -c \"Set :destination upload\" \"$OPTIONS\"\nelse\n  /usr/libexec/PlistBuddy -c \"Set :destination\
        \ export\" \"$OPTIONS\"\nfi\necho \"==> ExportOptions.plist:\"\nplutil -p \"$OPTIONS\"\n"
      if: steps.existing.outputs.skip_upload != 'true'
    - name: Resolve the exact upload commit
      if: steps.existing.outputs.skip_upload != 'true' && (steps.upload.outputs.enabled == 'true')
      run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
    - name: Require every surface gate before TestFlight upload
      if: steps.upload.outputs.enabled == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: 'const { verifyManifestPublication } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-verify-landing-deploy.mjs`);

          await verifyManifestPublication({ github, ...context.repo, sha: process.env.RELEASE_SHA });

          '
    - name: Export IPA and upload to App Store Connect
      env:
        UPLOAD: ${{ steps.upload.outputs.enabled }}
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: "set -euo pipefail\n# With destination=upload, xcodebuild signs the IPA, uploads it together\n# with its dSYMs\
        \ (uploadSymbols) to App Store Connect and fails the step\n# if App Store Connect rejects it. With destination=export\
        \ (dry run) the\n# IPA is written to $EXPORT_PATH instead. The API key is only needed for\n# the upload but is harmless\
        \ for a dry run.\nscripts/ci-xcodebuild.sh -exportArchive \\\n  -archivePath \"$ARCHIVE_PATH\" \\\n  -exportOptionsPlist\
        \ \"$BUILD_DIR/ExportOptions.plist\" \\\n  -exportPath \"$EXPORT_PATH\" \\\n  -authenticationKeyPath \"$ASC_KEY_PATH\"\
        \ \\\n  -authenticationKeyID \"$APP_STORE_CONNECT_KEY_ID\" \\\n  -authenticationKeyIssuerID \"$APP_STORE_CONNECT_ISSUER_ID\"\
        \ \\\n  2>&1 | tee \"$BUILD_DIR/export.log\"\n\nif [ \"$UPLOAD\" = \"true\" ]; then\n  echo \"==> Uploaded to App\
        \ Store Connect. The build appears in TestFlight once Apple finishes processing (typically 5-30 minutes).\"\nelse\n\
        \  echo \"==> Dry run: exported IPA(s):\"\n  ls -la \"$EXPORT_PATH\"\nfi\n"
      if: steps.existing.outputs.skip_upload != 'true'
    - name: Wait for App Store Connect processing
      if: steps.existing.outputs.skip_upload != 'true' && (steps.upload.outputs.enabled == 'true')
      env:
        VERSION: ${{ steps.version.outputs.version }}
        BUILD_NUMBER: ${{ steps.build_number.outputs.build }}
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        ASC_TIMEOUT_MINUTES: 20
        ASC_POLL_SECONDS: 60
      run: scripts/ci-asc-wait-for-build.sh "$VERSION" "$BUILD_NUMBER"
    - name: Verify exported IPA (dry run)
      if: steps.existing.outputs.skip_upload != 'true' && (steps.upload.outputs.enabled != 'true')
      env:
        VERSION: ${{ steps.version.outputs.version }}
        BUILD_NUMBER: ${{ steps.build_number.outputs.build }}
      run: "set -euo pipefail\nIPA=\"$(find \"$EXPORT_PATH\" -maxdepth 1 -name '*.ipa' -print -quit)\"\n[ -n \"$IPA\" ] ||\
        \ { echo \"::error::No .ipa produced in $EXPORT_PATH\"; exit 1; }\nUNPACK=\"$RUNNER_TEMP/ipa\"\nrm -rf \"$UNPACK\"\
        \ && mkdir -p \"$UNPACK\"\nunzip -q \"$IPA\" -d \"$UNPACK\"\nAPP_PATH=\"$(find \"$UNPACK/Payload\" -maxdepth 1 -name\
        \ '*.app' -print -quit)\"\n\nnode scripts/verify-ios-release-notes.mjs \"$APP_PATH\" \"$VERSION\" \"$BUILD_NUMBER\"\
        \ \"$(git rev-parse HEAD)\"\ncodesign --verify --verbose=2 \"$APP_PATH\"\ncodesign -d --entitlements - --xml \"$APP_PATH\"\
        \ > \"$RUNNER_TEMP/ipa-entitlements.plist\"\npython3 scripts/ci-verify-cloudkit-entitlements.py \"$RUNNER_TEMP/ipa-entitlements.plist\"\
        \nAPS=\"$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' \"$RUNNER_TEMP/ipa-entitlements.plist\" 2>/dev/null\
        \ || echo missing)\"\nif [ \"$APS\" != \"production\" ]; then\n  echo \"::warning::aps-environment is '$APS' in the\
        \ exported IPA; App Store builds are expected to carry 'production'. Check the App Store profile grants Push Notifications.\"\
        \nfi\nCONTAINER=\"$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers:0' \"$RUNNER_TEMP/ipa-entitlements.plist\"\
        \ 2>/dev/null || echo missing)\"\n[ \"$CONTAINER\" = \"$ICLOUD_CONTAINER\" ] || { echo \"::error::iCloud container\
        \ mismatch in exported IPA: expected $ICLOUD_CONTAINER, got '$CONTAINER'\"; exit 1; }\nsecurity cms -D -i \"$APP_PATH/embedded.mobileprovision\"\
        \ > \"$RUNNER_TEMP/ipa-profile.plist\"\nif plutil -extract ProvisionedDevices raw -o - \"$RUNNER_TEMP/ipa-profile.plist\"\
        \ >/dev/null 2>&1; then\n  echo \"::error::Exported IPA embeds a device-limited profile; this is not an App Store\
        \ build.\"\n  exit 1\nfi\necho \"==> IPA OK: $(basename \"$IPA\"), aps-environment=$APS, profile $(plutil -extract\
        \ Name raw -o - \"$RUNNER_TEMP/ipa-profile.plist\")\"\n"
    - name: Write job summary
      if: always()
      env:
        VERSION: ${{ steps.version.outputs.version }}
        BUILD_NUMBER: ${{ steps.build_number.outputs.build }}
        UPLOAD: ${{ steps.upload.outputs.enabled }}
      run: "{\n  echo \"### PastaIOS TestFlight build\"\n  echo \"\"\n  echo \"| | |\"\n  echo \"|---|---|\"\n  echo \"| Bundle\
        \ id | \\`$BUNDLE_ID\\` |\"\n  echo \"| Version | \\`${VERSION:-?}\\` |\"\n  echo \"| Build | \\`${BUILD_NUMBER:-?}\\\
        ` |\"\n  echo \"| Profile | ${PROFILE_NAME:-?} |\"\n  echo \"| Uploaded | ${UPLOAD:-false} |\"\n  echo \"| Commit\
        \ | \\`${GITHUB_SHA::7}\\` |\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload IPA and dSYMs (dry run)
      if: steps.upload.outputs.enabled != 'true' && success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: PastaIOS-${{ steps.version.outputs.version }}-${{ steps.build_number.outputs.build }}
        path: 'build/export/*.ipa

          build/PastaIOS.xcarchive/dSYMs

          '
        retention-days: 14
        if-no-files-found: error
    - name: Upload logs (on failure)
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-ios-logs
        path: 'build/*.log

          build/ExportOptions.plist

          build/export/*.log

          build/export/*.plist

          '
        retention-days: 7
        if-no-files-found: ignore
    - name: Verify TestFlight group delivery
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: ruby scripts/release-apple.rb distribute "$RUNNER_TEMP/release-manifest.json" ios
    - name: Clean up credentials
      if: always()
      run: "python3 scripts/ci-keychain-search.py restore \"$RUNNER_TEMP/keychain-search.json\"\nrm -rf \"$RUNNER_TEMP/asc-private-keys\"\
        \nrm -f \"$RUNNER_TEMP/ios-distribution.p12\"\nif [ -n \"${KEYCHAIN_PATH:-}\" ] && [ -f \"$KEYCHAIN_PATH\" ]; then\n\
        \  security delete-keychain \"$KEYCHAIN_PATH\" || true\nfi\nif [ -n \"${PROFILE_UUID:-}\" ]; then\n  if [ -f \"$RUNNER_TEMP/original.mobileprovision\"\
        \ ]; then\n    mv -f \"$RUNNER_TEMP/original.mobileprovision\" \"$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision\"\
        \n  else\n    rm -f \"$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision\"\n  fi\nfi\n"
'on':
  workflow_call:
    inputs:
      manifest:
        required: true
        type: string
