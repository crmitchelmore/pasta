name: Release iOS (TestFlight)

# Archives the PastaIOS companion app, exports an App Store Connect IPA and
# uploads it to TestFlight. See PastaIOS/DEPLOY.md for the secrets this needs,
# how the build number is derived, and how to cut a release.
#
# Triggers:
#   - every v*.*.* tag (the same tags that drive the macOS release.yml, created
#     automatically by ci.yml's auto-release job)
#   - manual workflow_dispatch, optionally as a dry run that exports the IPA
#     without uploading (does not consume an App Store Connect build number)
#
# Signing: manual, with an Apple Distribution certificate (.p12) and an App
# Store provisioning profile supplied as secrets. This mirrors the Release build
# settings checked into PastaIOS.xcodeproj and the lane proven in sibling
# projects. The App Store Connect API key is used only to upload.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.5.0). Defaults to the latest v* tag reachable from the selected ref.'
        required: false
        type: string
      build_number:
        description: 'CFBundleVersion override. Defaults to BUILD_NUMBER_BASE + run number.'
        required: false
        type: string
      upload:
        description: 'Upload to TestFlight. Untick for a dry run that only exports the IPA.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Never let two releases race App Store Connect; queue instead of cancelling.
concurrency:
  group: release-ios
  cancel-in-progress: false

env:
  PROJECT: PastaIOS/PastaIOS.xcodeproj
  SCHEME: PastaIOS
  BUNDLE_ID: com.pasta.ios
  ICLOUD_CONTAINER: iCloud.com.pasta.ios
  # CFBundleVersion = BUILD_NUMBER_BASE + github.run_number. The offset keeps
  # CI builds strictly above the build numbers previously uploaded by hand
  # (PastaIOS.xcodeproj is at CURRENT_PROJECT_VERSION = 7). Raise it, never
  # lower it, if a higher build number is ever uploaded out of band.
  BUILD_NUMBER_BASE: 100
  BUILD_DIR: build
  ARCHIVE_PATH: build/PastaIOS.xcarchive
  EXPORT_PATH: build/export

jobs:
  # ============================================================================
  # RELEASE GATE: the XCUITest e2e suite must pass on the exact ref being
  # released before anything is archived or uploaded. Every step is a
  # subcommand of scripts/ci-ios-e2e.sh — the same script ci.yml's `ios-e2e`
  # job runs on every PR — so the two cannot drift.
  # ============================================================================
  preflight:
    name: Preflight — iOS E2E (XCUITest)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DERIVED_DATA: .build/ios-derived
      RESULT_BUNDLE: .build/ios-e2e/PastaIOSUITests.xcresult
      DIAG_DIR: .build/ios-e2e/diagnostics
      SIM_NAME: PastaCI iPhone

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM checkouts and build intermediates
        uses: actions/cache@v4
        with:
          path: |
            .build/ios-derived/SourcePackages
            .build/ios-derived/Build/Intermediates.noindex
          key: ios-e2e-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift', 'PastaIOS/PastaIOS.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ios-e2e-${{ runner.os }}-

      - name: Create iPhone simulator
        run: scripts/ci-ios-e2e.sh create-simulator

      - name: Resolve Swift packages
        run: scripts/ci-ios-e2e.sh resolve

      - name: Build for testing
        run: scripts/ci-ios-e2e.sh build-for-testing

      - name: Run XCUITests
        run: scripts/ci-ios-e2e.sh test

      - name: Summarise results
        if: always()
        run: scripts/ci-ios-e2e.sh summarise

      - name: Collect crash logs and simulator log on failure
        if: failure()
        run: scripts/ci-ios-e2e.sh diagnostics

      - name: Upload result bundle and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-preflight-diagnostics
          path: |
            .build/ios-e2e/PastaIOSUITests.xcresult
            .build/ios-e2e/diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Shut down simulator
        if: always()
        run: scripts/ci-ios-e2e.sh cleanup

  testflight:
    name: Archive, Export & Upload to TestFlight
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      # ==========================================================================
      # PREFLIGHT
      # ==========================================================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          set -euo pipefail
          missing=()
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY \
                      APPLE_TEAM_ID IOS_DISTRIBUTION_P12 IOS_DISTRIBUTION_PASSWORD IOS_APPSTORE_PROFILE; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secret(s): ${missing[*]}. See PastaIOS/DEPLOY.md for what each one is and how to create it."
            exit 1
          fi
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be a 10-character Apple Team ID."
            exit 1
          fi
          if [[ ! "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID must be the 10-character key id shown in App Store Connect."
            exit 1
          fi
          if [[ ! "$APP_STORE_CONNECT_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::APP_STORE_CONNECT_ISSUER_ID must be the issuer UUID shown in App Store Connect."
            exit 1
          fi
          echo "==> All required secrets present"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(printf '%s' "${INPUT_VERSION:-}" | xargs)"
            VERSION="${VERSION#v}"
            if [ -z "$VERSION" ]; then
              VERSION="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
            fi
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Could not determine a semantic version (got '${VERSION:-<empty>}'). Run from a v*.*.* tag or pass the 'version' input."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "==> Marketing version: $VERSION"

      - name: Determine build number
        id: build_number
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BUILD_NUMBER:-}" ]; then
            BUILD="$(printf '%s' "$INPUT_BUILD_NUMBER" | xargs)"
            SOURCE="workflow_dispatch input"
          else
            BUILD=$(( BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER ))
            SOURCE="BUILD_NUMBER_BASE ($BUILD_NUMBER_BASE) + run number ($GITHUB_RUN_NUMBER)"
          fi
          if [[ ! "$BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Build number must be a positive integer (got '$BUILD')."
            exit 1
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "==> Build number: $BUILD ($SOURCE)"

      - name: Decide whether to upload
        id: upload
        env:
          INPUT_UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_UPLOAD}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "==> DRY RUN: the IPA will be exported and attached as an artifact but NOT uploaded."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "==> Upload to TestFlight enabled."
          fi

      # ==========================================================================
      # CREDENTIALS
      # ==========================================================================

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          # ~/.appstoreconnect/private_keys is where xcodebuild/altool look by default.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          if ! printf '%s' "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$KEY_PATH" 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_API_KEY is not valid base64. Store it with: base64 -i AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 | pbcopy"
            exit 1
          fi
          chmod 600 "$KEY_PATH"
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"; then
            echo "::error::Decoded APP_STORE_CONNECT_API_KEY is not a PEM private key (.p8). Re-export it from App Store Connect."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "==> API key installed at $KEY_PATH"

      - name: Import distribution certificate and provisioning profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          set -euo pipefail

          echo "==> Creating temporary keychain"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "==> Importing Apple Distribution certificate"
          CERT_PATH="$RUNNER_TEMP/ios-distribution.p12"
          if ! printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$CERT_PATH" 2>/dev/null; then
            echo "::error::IOS_DISTRIBUTION_P12 is not valid base64."
            exit 1
          fi
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERT_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "::error::IOS_DISTRIBUTION_P12 does not contain an 'Apple Distribution' identity (see PastaIOS/DEPLOY.md for how to export one)."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "==> Installing App Store provisioning profile"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_TMP="$RUNNER_TEMP/ios-appstore.mobileprovision"
          if ! printf '%s' "$IOS_APPSTORE_PROFILE" | base64 --decode > "$PROFILE_TMP" 2>/dev/null; then
            echo "::error::IOS_APPSTORE_PROFILE is not valid base64."
            exit 1
          fi
          PROFILE_PLIST="$RUNNER_TEMP/ios-appstore.plist"
          security cms -D -i "$PROFILE_TMP" > "$PROFILE_PLIST"
          PROFILE_UUID="$(plutil -extract UUID raw -o - "$PROFILE_PLIST")"
          PROFILE_NAME="$(plutil -extract Name raw -o - "$PROFILE_PLIST")"
          PROFILE_TEAM="$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST")"
          PROFILE_APP_ID="$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST")"
          PROFILE_EXPIRY="$(plutil -extract ExpirationDate raw -o - "$PROFILE_PLIST")"

          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::IOS_APPSTORE_PROFILE belongs to team '$PROFILE_TEAM', but APPLE_TEAM_ID is '$APPLE_TEAM_ID'."
            exit 1
          fi
          if [ "$PROFILE_APP_ID" != "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]; then
            echo "::error::IOS_APPSTORE_PROFILE is for '$PROFILE_APP_ID', expected '${APPLE_TEAM_ID}.${BUNDLE_ID}'."
            exit 1
          fi
          if plutil -extract ProvisionedDevices raw -o - "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "::error::IOS_APPSTORE_PROFILE lists provisioned devices, so it is a development/ad-hoc profile, not an App Store profile."
            exit 1
          fi
          EXPIRY_EPOCH="$(date -j -f '%Y-%m-%dT%H:%M:%SZ' "$PROFILE_EXPIRY" +%s 2>/dev/null || echo 0)"
          if [ "$EXPIRY_EPOCH" -gt 0 ] && [ "$EXPIRY_EPOCH" -lt "$(date +%s)" ]; then
            echo "::error::IOS_APPSTORE_PROFILE '$PROFILE_NAME' expired on $PROFILE_EXPIRY. Regenerate it in the Apple Developer portal."
            exit 1
          fi
          if ! plutil -extract Entitlements xml1 -o - "$PROFILE_PLIST" | grep -q "<string>${ICLOUD_CONTAINER}</string>"; then
            echo "::error::Profile '$PROFILE_NAME' does not grant the ${ICLOUD_CONTAINER} iCloud container. Enable iCloud/CloudKit on the ${BUNDLE_ID} App ID, regenerate the App Store profile and update IOS_APPSTORE_PROFILE."
            exit 1
          fi
          if ! plutil -extract Entitlements.aps-environment raw -o - "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "::error::Profile '$PROFILE_NAME' does not grant aps-environment. Enable Push Notifications on the ${BUNDLE_ID} App ID and regenerate the profile."
            exit 1
          fi

          cp "$PROFILE_TMP" "$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"
          rm -f "$PROFILE_TMP"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "==> Installed profile '$PROFILE_NAME' ($PROFILE_UUID), expires $PROFILE_EXPIRY"

      # ==========================================================================
      # ARCHIVE
      # ==========================================================================

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$BUILD_DIR/DerivedData"

      - name: Archive PastaIOS
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "==> Archiving $SCHEME $VERSION ($BUILD_NUMBER) signed with project profile $PROFILE_NAME"
          # Archive SIGNED so CODE_SIGN_ENTITLEMENTS (iCloud, push) are baked in.
          # Do NOT pass target-specific settings on the command line: a CLI
          # override applies to every target, including SwiftPM package targets.
          #   - PROVISIONING_PROFILE_SPECIFIER would hit GRDB_GRDB, which rejects
          #     provisioning profiles.
          #   - SWIFT_ACTIVE_COMPILATION_CONDITIONS would replace the SWIFT_PACKAGE
          #     define GRDB needs to import its SQLite shim (v1.5.9 failed with
          #     "cannot find '_registerErrorLogCallback' in scope").
          # The project's Release configuration owns Manual / Apple Distribution,
          # the "PastaIOS AppStore CI" profile name and the
          # PASTA_IOS_CLOUDKIT_PROVISIONED compile flag on the app target only;
          # scripts/ci-ios-e2e.sh asserts the flag is present before any upload.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            2>&1 | tee "$BUILD_DIR/archive.log"

      - name: Verify archive metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build }}
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/PastaIOS.app"
          [ -d "$APP_PATH" ] || { echo "::error::Archive did not produce $APP_PATH"; exit 1; }

          ACTUAL_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          [ "$ACTUAL_ID" = "$BUNDLE_ID" ] || { echo "::error::Bundle id mismatch: expected $BUNDLE_ID, got $ACTUAL_ID"; exit 1; }
          [ "$ACTUAL_VERSION" = "$VERSION" ] || { echo "::error::Version mismatch: expected $VERSION, got $ACTUAL_VERSION"; exit 1; }
          [ "$ACTUAL_BUILD" = "$BUILD_NUMBER" ] || { echo "::error::Build mismatch: expected $BUILD_NUMBER, got $ACTUAL_BUILD"; exit 1; }

          codesign -d --entitlements - --xml "$APP_PATH" > "$RUNNER_TEMP/archive-entitlements.plist"
          CONTAINER="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers:0' "$RUNNER_TEMP/archive-entitlements.plist" 2>/dev/null || true)"
          [ "$CONTAINER" = "$ICLOUD_CONTAINER" ] || { echo "::error::iCloud container mismatch in archive: expected $ICLOUD_CONTAINER, got '${CONTAINER:-missing}'"; exit 1; }

          [ -d "$ARCHIVE_PATH/dSYMs/PastaIOS.app.dSYM" ] || echo "::warning::No dSYM found in archive; crash symbolication will be unavailable."
          echo "==> Archive OK: $ACTUAL_ID $ACTUAL_VERSION ($ACTUAL_BUILD), container $CONTAINER"

      # ==========================================================================
      # EXPORT & UPLOAD
      # ==========================================================================

      - name: Prepare export options
        env:
          UPLOAD: ${{ steps.upload.outputs.enabled }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          OPTIONS="$BUILD_DIR/ExportOptions.plist"
          cp PastaIOS/ExportOptions.plist "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$BUNDLE_ID $PROFILE_UUID" "$OPTIONS"
          if [ "$UPLOAD" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Set :destination upload" "$OPTIONS"
          else
            /usr/libexec/PlistBuddy -c "Set :destination export" "$OPTIONS"
          fi
          echo "==> ExportOptions.plist:"
          plutil -p "$OPTIONS"

      - name: Export IPA and upload to App Store Connect
        env:
          UPLOAD: ${{ steps.upload.outputs.enabled }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # With destination=upload, xcodebuild signs the IPA, uploads it together
          # with its dSYMs (uploadSymbols) to App Store Connect and fails the step
          # if App Store Connect rejects it. With destination=export (dry run) the
          # IPA is written to $EXPORT_PATH instead. The API key is only needed for
          # the upload but is harmless for a dry run.
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$BUILD_DIR/ExportOptions.plist" \
            -exportPath "$EXPORT_PATH" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee "$BUILD_DIR/export.log"

          if [ "$UPLOAD" = "true" ]; then
            echo "==> Uploaded to App Store Connect. The build appears in TestFlight once Apple finishes processing (typically 5-30 minutes)."
          else
            echo "==> Dry run: exported IPA(s):"
            ls -la "$EXPORT_PATH"
          fi

      # The upload returning is not the same as Apple accepting the build:
      # processing can still end INVALID/FAILED. Poll the App Store Connect API
      # (JWT minted from the same APP_STORE_CONNECT_* secrets) until the build
      # is VALID; rejection or an unverified 20-minute timeout fails the job.
      # A timeout does not undo the upload. See scripts/ci-asc-wait-for-build.sh.
      - name: Wait for App Store Connect processing
        if: steps.upload.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_TIMEOUT_MINUTES: 20
          ASC_POLL_SECONDS: 60
        run: scripts/ci-asc-wait-for-build.sh "$VERSION" "$BUILD_NUMBER"

      - name: Verify exported IPA (dry run)
        if: steps.upload.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          IPA="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          [ -n "$IPA" ] || { echo "::error::No .ipa produced in $EXPORT_PATH"; exit 1; }
          UNPACK="$RUNNER_TEMP/ipa"
          rm -rf "$UNPACK" && mkdir -p "$UNPACK"
          unzip -q "$IPA" -d "$UNPACK"
          APP_PATH="$(find "$UNPACK/Payload" -maxdepth 1 -name '*.app' -print -quit)"

          codesign --verify --verbose=2 "$APP_PATH"
          codesign -d --entitlements - --xml "$APP_PATH" > "$RUNNER_TEMP/ipa-entitlements.plist"
          APS="$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/ipa-entitlements.plist" 2>/dev/null || echo missing)"
          if [ "$APS" != "production" ]; then
            echo "::warning::aps-environment is '$APS' in the exported IPA; App Store builds are expected to carry 'production'. Check the App Store profile grants Push Notifications."
          fi
          CONTAINER="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers:0' "$RUNNER_TEMP/ipa-entitlements.plist" 2>/dev/null || echo missing)"
          [ "$CONTAINER" = "$ICLOUD_CONTAINER" ] || { echo "::error::iCloud container mismatch in exported IPA: expected $ICLOUD_CONTAINER, got '$CONTAINER'"; exit 1; }
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/ipa-profile.plist"
          if plutil -extract ProvisionedDevices raw -o - "$RUNNER_TEMP/ipa-profile.plist" >/dev/null 2>&1; then
            echo "::error::Exported IPA embeds a device-limited profile; this is not an App Store build."
            exit 1
          fi
          echo "==> IPA OK: $(basename "$IPA"), aps-environment=$APS, profile $(plutil -extract Name raw -o - "$RUNNER_TEMP/ipa-profile.plist")"

      # ==========================================================================
      # REPORTING & CLEANUP
      # ==========================================================================

      - name: Write job summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build }}
          UPLOAD: ${{ steps.upload.outputs.enabled }}
        run: |
          {
            echo "### PastaIOS TestFlight build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Bundle id | \`$BUNDLE_ID\` |"
            echo "| Version | \`${VERSION:-?}\` |"
            echo "| Build | \`${BUILD_NUMBER:-?}\` |"
            echo "| Profile | ${PROFILE_NAME:-?} |"
            echo "| Uploaded | ${UPLOAD:-false} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA and dSYMs (dry run)
        if: steps.upload.outputs.enabled != 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: PastaIOS-${{ steps.version.outputs.version }}-${{ steps.build_number.outputs.build }}
          path: |
            build/export/*.ipa
            build/PastaIOS.xcarchive/dSYMs
          retention-days: 14
          if-no-files-found: error

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-logs
          path: |
            build/*.log
            build/ExportOptions.plist
            build/export/*.log
            build/export/*.plist
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean up credentials
        if: always()
        run: |
          rm -rf "$HOME/.appstoreconnect/private_keys" || true
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision" || true
          fi
