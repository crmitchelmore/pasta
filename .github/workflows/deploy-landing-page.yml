name: Deploy Landing Page

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Queue deployments so an older run cannot finish over a newer deployment.
concurrency:
  group: landing-page-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout the exact CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Require every surface gate for the deployment commit
        id: gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { verifyLandingDeploy } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-verify-landing-deploy.mjs`);
            const deploy = await verifyLandingDeploy({
              github, ...context.repo, sha: process.env.DEPLOY_SHA,
              runId: context.payload.workflow_run?.id,
              allowIrrelevantSkip: context.eventName === 'workflow_run',
            });
            core.setOutput('deploy', String(deploy));
            if (!deploy) core.info('CI verified no landing changes; no deployment is needed.');

      - name: Preserve the live Sparkle appcast
        if: steps.gate.outputs.deploy == 'true'
        # Release publishes and commits this feed separately. Do not roll it
        # back while deploying a previously tested landing-page commit.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://pasta-app.com/appcast.xml -o landing-page/appcast.xml
          grep -q "<item>" landing-page/appcast.xml || { echo "::error::Fetched appcast has no <item>; refusing to deploy"; exit 1; }
          echo "Preserving live appcast: $(grep -oE '<title>Version [0-9.]+</title>' landing-page/appcast.xml | head -1)"

      - name: Refuse a superseded deployment
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { verifyCurrentLandingSource } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-verify-landing-deploy.mjs`);
            await verifyCurrentLandingSource({ github, ...context.repo, sha: process.env.DEPLOY_SHA });

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          wranglerVersion: '4.129.1'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy landing-page --project-name=pasta-app --branch=main --commit-dirty=true

      - name: Set up Node for post-publication verification
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install verification dependencies
        if: steps.gate.outputs.deploy == 'true'
        working-directory: landing-page
        run: ../scripts/ci-npm-ci.sh

      - name: Verify the published landing page
        if: steps.gate.outputs.deploy == 'true'
        working-directory: landing-page
        run: npm run test:live
