name: Release
permissions:
  contents: write
  actions: read
concurrency:
  group: pasta-mac-release-worker
  queue: max
  cancel-in-progress: false
env:
  APP_NAME: PastaApp
  BUNDLE_ID: com.pasta.clipboard
  DMG_NAME: Pasta
  GH_TOKEN: ${{ github.token }}
jobs:
  build-and-release:
    name: Build, Sign, Notarize & Release
    runs-on: pasta-local
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ inputs.manifest }}
    - name: Load frozen release manifest
      env:
        MANIFEST: ${{ inputs.manifest }}
      run: node scripts/release-train.mjs configure --tag "$MANIFEST" --surface mac-direct
    - name: Stamp isolated release configuration
      run: python3 scripts/configure-release-train.py
    - name: Extract version from tag
      id: version
      run: echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
    - name: Resolve Swift dependencies
      run: 'python3 scripts/ci-verify-dependency-locks.py

        swift package --cache-path "$RUNNER_TEMP/swiftpm-cache" resolve --force-resolved-versions

        '
    - name: Build release binary (arm64)
      run: swift build --cache-path "$RUNNER_TEMP/swiftpm-cache" --force-resolved-versions -c release --arch arm64
    - name: Build release binary (x86_64)
      run: swift build --cache-path "$RUNNER_TEMP/swiftpm-cache" --force-resolved-versions -c release --arch x86_64
    - name: Create universal binary
      run: |
        set -euo pipefail
        mkdir -p .build/universal
        lipo -create \
          .build/arm64-apple-macosx/release/PastaApp \
          .build/x86_64-apple-macosx/release/PastaApp \
          -output .build/universal/PastaApp
        bash scripts/ci-prepare-macos-executable.sh .build/universal/PastaApp
        file .build/universal/PastaApp
    - name: Create app bundle structure
      run: "BUILD_DIR=\".build/universal\"\n# App bundle is named \"Pasta.app\" but executable inside is still \"PastaApp\"\
        \nAPP_DIR=\"${BUILD_DIR}/${DMG_NAME}.app\"\n\necho \"==> Creating app bundle at $APP_DIR\"\nrm -rf \"$APP_DIR\"\n\
        mkdir -p \"$APP_DIR/Contents/MacOS\"\nmkdir -p \"$APP_DIR/Contents/Resources\"\nmkdir -p \"$APP_DIR/Contents/Frameworks\"\
        \n\n# Copy the universal binary (keep internal name as PastaApp)\ncp \".build/universal/${APP_NAME}\" \"$APP_DIR/Contents/MacOS/${APP_NAME}\"\
        \n\n# Stage runtime resources once, with matching train artwork\npython3 scripts/ci-stage-macos-resources.py .build/arm64-apple-macosx/release \"$APP_DIR\" \"$ICON_PATH\"\n\n\
        # Copy Sparkle framework\nSPARKLE_PATH=$(find .build -name \"Sparkle.framework\" -type d | head -1)\nif [ -n \"$SPARKLE_PATH\"\
        \ ]; then\n  echo \"==> Copying Sparkle framework from $SPARKLE_PATH\"\n  cp -R \"$SPARKLE_PATH\" \"$APP_DIR/Contents/Frameworks/\"\
        \nelse\n  echo \"ERROR: Sparkle.framework not found!\"\n  exit 1\nfi\n\n# Fix rpath to find frameworks in Contents/Frameworks\n\
        echo \"==> Fixing rpath for Sparkle framework\"\ninstall_name_tool -add_rpath \"@executable_path/../Frameworks\" \"\
        $APP_DIR/Contents/MacOS/${APP_NAME}\"\n\n# Verify rpath\necho \"==> Verifying rpath:\"\notool -l \"$APP_DIR/Contents/MacOS/${APP_NAME}\"\
        \ | grep -A2 LC_RPATH\n\n# Make executable\nchmod +x \"$APP_DIR/Contents/MacOS/${APP_NAME}\"\n\necho \"APP_DIR=$APP_DIR\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Generate Info.plist with version
      env:
        SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
      run: "# Get the short commit SHA\nCOMMIT_SHA=$(git rev-parse --short HEAD)\n\ncat > \"${APP_DIR}/Contents/Info.plist\"\
        \ <<PLIST\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
        >\n<plist version=\"1.0\">\n<dict>\n    <key>CFBundleName</key>\n    <string>${TRAIN_DISPLAY_NAME}</string>\n    <key>CFBundleDisplayName</key>\n\
        \    <string>${TRAIN_DISPLAY_NAME}</string>\n    <key>CFBundleIdentifier</key>\n    <string>${BUNDLE_ID}</string>\n\
        \    <key>CFBundleVersion</key>\n    <string>${BUILD_NUMBER}</string>\n    <key>CFBundleShortVersionString</key>\n\
        \    <string>${RELEASE_VERSION}</string>\n    <key>CFBundleExecutable</key>\n    <string>${APP_NAME}</string>\n  \
        \  <key>CFBundlePackageType</key>\n    <string>APPL</string>\n    <key>CFBundleInfoDictionaryVersion</key>\n    <string>6.0</string>\n\
        \    <key>LSApplicationCategoryType</key>\n    <string>public.app-category.productivity</string>\n    <key>LSMinimumSystemVersion</key>\n\
        \    <string>14.0</string>\n    <key>NSHighResolutionCapable</key>\n    <true/>\n    <key>NSPrincipalClass</key>\n\
        \    <string>NSApplication</string>\n    <key>NSHumanReadableCopyright</key>\n    <string>\xA9 $(date +%Y) Pasta</string>\n\
        \    <key>CFBundleIconFile</key>\n    <string>AppIcon</string>\n    <key>CFBundleIconName</key>\n    <string>AppIcon</string>\n\
        \    <key>LSUIElement</key>\n    <true/>\n    <!-- Git Commit SHA for About screen -->\n    <key>GitCommitSHA</key>\n\
        \    <string>${COMMIT_SHA}</string>\n    <!-- Sparkle Auto-Update Configuration -->\n    <key>SUFeedURL</key>\n  \
        \  <string>${FEED_URL}</string>\n    <key>SUPublicEDKey</key>\n    <string>${SPARKLE_PUBLIC_KEY}</string>\n    <key>SUEnableAutomaticChecks</key>\n\
        \    <true/>\n    <key>SUScheduledCheckInterval</key>\n    <integer>86400</integer>\n    <!-- Opt-in product analytics.\
        \ Empty key = analytics disabled entirely. -->\n    <key>PostHogProjectKey</key>\n    <string>${POSTHOG_PROJECT_KEY}</string>\n\
        \    <key>PostHogHost</key>\n    <string>https://eu.i.posthog.com</string>\n<key>PastaReleaseTrain</key><string>${RELEASE_TRAIN}</string>\n\
        <key>GitCommitSHA</key><string>${RELEASE_SOURCE}</string>\n</dict>\n</plist>\nPLIST\n\necho \"==> Info.plist created\"\
        \ncat \"${APP_DIR}/Contents/Info.plist\"\n"
    - name: Import Developer ID certificate
      env:
        CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_PASSWORD }}
      run: "# Create temporary keychain\nKEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db\nKEYCHAIN_PASSWORD=$(openssl rand\
        \ -base64 32)\n\necho \"==> Creating temporary keychain\"\necho \"KEYCHAIN_PATH=$KEYCHAIN_PATH\" >> \"$GITHUB_ENV\"\
        \nsecurity create-keychain -p \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN_PATH\"\nsecurity set-keychain-settings -lut 21600\
        \ \"$KEYCHAIN_PATH\"\nsecurity unlock-keychain -p \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN_PATH\"\n\necho \"==> Importing\
        \ certificate\"\necho \"$CERTIFICATE_BASE64\" | base64 --decode > certificate.p12\nsecurity import certificate.p12\
        \ \\\n  -k \"$KEYCHAIN_PATH\" \\\n  -P \"$CERTIFICATE_PASSWORD\" \\\n  -T /usr/bin/codesign \\\n  -T /usr/bin/productsign\n\
        \n# Set keychain search list\npython3 scripts/ci-keychain-search.py add \"$RUNNER_TEMP/keychain-search.json\" \"$KEYCHAIN_PATH\"\
        \nsecurity set-key-partition-list -S apple-tool:,apple:,codesign: -s -k \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN_PATH\"\
        \ >/dev/null\n\n# Clean up certificate file\nrm certificate.p12\n\necho \"KEYCHAIN_PATH=$KEYCHAIN_PATH\" >> \"$GITHUB_ENV\"\
        \necho \"KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD\" >> \"$GITHUB_ENV\"\n\necho \"==> Certificate imported successfully\"\
        \n"
    - name: Find signing identity
      id: signing
      run: "# Find the Developer ID Application certificate\nIDENTITY=$(security find-identity -v -p codesigning \"$KEYCHAIN_PATH\"\
        \ | grep \"Developer ID Application\" | head -1 | grep -o '\".*\"' | tr -d '\"')\n\nif [ -z \"$IDENTITY\" ]; then\n\
        \  echo \"ERROR: No Developer ID Application certificate found!\"\n  security find-identity -v -p codesigning \"$KEYCHAIN_PATH\"\
        \n  exit 1\nfi\n\necho \"identity=$IDENTITY\" >> \"$GITHUB_OUTPUT\"\necho \"==> Found signing identity: $IDENTITY\"\
        \n"
    - name: Prepare entitlements file
      run: 'cp Resources/release.entitlements entitlements.plist

        echo "==> Entitlements file:"

        cat entitlements.plist

        '
    - name: Validate entitlements (no restricted keys without profile)
      run: "# These entitlements require specific provisioning profile capabilities.\n# Adding one without updating the profile\
        \ will cause SIGKILL on launch.\nRESTRICTED_KEYS=\"aps-environment get-task-allow com.apple.developer.team-identifier\"\
        \n\nfor key in $RESTRICTED_KEYS; do\n  if grep -q \"$key\" entitlements.plist; then\n    echo \"ERROR: entitlements.plist\
        \ contains restricted key '$key'.\"\n    echo \"This requires a matching provisioning profile capability.\"\n    echo\
        \ \"Remove it or update the profile before releasing.\"\n    exit 1\n  fi\ndone\necho \"==> Entitlements validation\
        \ passed (no unexpected restricted keys)\"\n"
    - name: Embed provisioning profile
      run: 'echo "$TRAIN_PROFILE" | base64 -D -o "${APP_DIR}/Contents/embedded.provisionprofile"

        echo "==> Provisioning profile embedded"

        ls -la "${APP_DIR}/Contents/embedded.provisionprofile"

        '
      env:
        TRAIN_PROFILE: ${{ env.RELEASE_TRAIN == 'alpha' && secrets.ALPHA_MACOS_PROVISIONING_PROFILE || secrets.MACOS_PROVISIONING_PROFILE
          }}
    - name: Create per-architecture app bundles
      run: |
        set -euo pipefail
        # Sparkle keeps the universal bundle so older updaters (which ignore
        # hardware requirements) can never install the wrong slice. Website and
        # Homebrew downloads get thin copies, roughly half the size each.
        if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
          echo "::error::Rosetta 2 is missing on this runner, so the Intel build cannot be launch-tested. Install it once with: softwareupdate --install-rosetta --agree-to-license"
          exit 1
        fi
        for arch in arm64 x86_64; do
          THIN_APP=".build/thin-$arch/${DMG_NAME}.app"
          rm -rf ".build/thin-$arch"
          mkdir -p ".build/thin-$arch"
          ditto "$APP_DIR" "$THIN_APP"
          while IFS= read -r -d '' file; do
            archs=$(lipo -archs "$file" 2>/dev/null) || continue
            [ "$archs" = "$arch" ] && continue
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::$file has no $arch slice ($archs)"; exit 1 ;;
            esac
            lipo -thin "$arch" "$file" -output "$file.thin"
            chmod "$(stat -f '%Lp' "$file")" "$file.thin"
            mv -f "$file.thin" "$file"
          done < <(find "$THIN_APP" -type f -print0)
          while IFS= read -r -d '' file; do
            archs=$(lipo -archs "$file" 2>/dev/null) || continue
            if [ "$archs" != "$arch" ]; then
              echo "::error::$file still contains '$archs' after thinning to $arch"
              exit 1
            fi
          done < <(find "$THIN_APP" -type f -print0)
          echo "==> $arch bundle: $(du -sh "$THIN_APP" | cut -f1) (universal: $(du -sh "$APP_DIR" | cut -f1))"
        done
        echo "APP_DIR_ARM64=.build/thin-arm64/${DMG_NAME}.app" >> "$GITHUB_ENV"
        echo "APP_DIR_X86_64=.build/thin-x86_64/${DMG_NAME}.app" >> "$GITHUB_ENV"
    - name: Code sign app bundles
      run: |
        IDENTITY="${{ steps.signing.outputs.identity }}"

        sign_bundle() {
          local app="$1"
          echo "==> Signing $app with hardened runtime"

          # Sign framework internals first (WITHOUT app entitlements)
          # Applying iCloud/CloudKit entitlements to framework binaries causes
          # dyld signature rejection at launch.
          echo "==> Signing framework binaries (no app entitlements)..."
          find "${app}/Contents/Frameworks" -type f -perm +111 | while read -r binary; do
            if file "$binary" | grep -q "Mach-O"; then
              echo "  Signing: $binary"
              codesign --force --keychain "$KEYCHAIN_PATH" \
                --sign "$IDENTITY" \
                --options runtime \
                --timestamp \
                "$binary" || true
            fi
          done

          # Sign framework bundles (XPC services, apps inside frameworks)
          find "${app}/Contents/Frameworks" -name "*.xpc" -o -name "*.app" | while read -r bundle; do
            if [ -d "$bundle" ]; then
              echo "  Signing bundle: $bundle"
              codesign --force --keychain "$KEYCHAIN_PATH" \
                --sign "$IDENTITY" \
                --options runtime \
                --timestamp \
                "$bundle" || true
            fi
          done

          # Sign the framework itself
          find "${app}/Contents/Frameworks" -name "*.framework" | while read -r fw; do
            echo "  Signing framework: $fw"
            codesign --force --keychain "$KEYCHAIN_PATH" \
              --sign "$IDENTITY" \
              --options runtime \
              --timestamp \
              "$fw" || true
          done

          # Sign the main app binary WITH entitlements
          echo "==> Signing main binary with entitlements..."
          codesign --force --keychain "$KEYCHAIN_PATH" \
            --sign "$IDENTITY" \
            --options runtime \
            --timestamp \
            --entitlements entitlements.plist \
            "${app}/Contents/MacOS/PastaApp"

          # Sign the app bundle (top-level, with entitlements)
          echo "==> Signing app bundle..."
          codesign --force --keychain "$KEYCHAIN_PATH" \
            --sign "$IDENTITY" \
            --options runtime \
            --timestamp \
            --entitlements entitlements.plist \
            "${app}"

          echo "==> Verifying signature"
          codesign --verify --verbose=4 "${app}"

          # Verify entitlements are NOT on framework binaries
          echo "==> Checking framework entitlements are clean..."
          SPARKLE_ENTS=$(codesign -d --entitlements - "${app}/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" 2>&1 || true)
          if echo "$SPARKLE_ENTS" | grep -q "icloud"; then
            echo "ERROR: Sparkle binary has iCloud entitlements — this will crash at launch!"
            exit 1
          fi
          echo "✓ Framework entitlements are clean"
        }

        for app in "$APP_DIR" "$APP_DIR_ARM64" "$APP_DIR_X86_64"; do
          sign_bundle "$app"
        done
    - name: Install create-dmg
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: create-dmg/create-dmg
        ref: a2b71d0fda6d0df2a86dc7f67082d4d73e84c59f
        path: .build/tools/create-dmg
        persist-credentials: false
    - name: Add pinned create-dmg to PATH
      run: echo "$GITHUB_WORKSPACE/.build/tools/create-dmg" >> "$GITHUB_PATH"
    - name: Create fancy DMGs
      id: dmg
      run: |
        set -euo pipefail
        BASE="${DMG_NAME// /-}-${{ steps.version.outputs.version }}"
        # The universal DMG keeps its historical name: Sparkle, the appcast and
        # older download links all point at it.
        DMG_FILE="$BASE.dmg"
        DMG_ARM64="$BASE-AppleSilicon.dmg"
        DMG_X86_64="$BASE-Intel.dmg"

        create_dmg() {
          echo "==> Creating $1 from $2"
          bash scripts/ci-create-macos-dmg.sh \
            --volname "${DMG_NAME}" \
            --volicon "$ICON_PATH" \
            --background "Resources/DMG/background@2x.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "${DMG_NAME}.app" 180 200 \
            --app-drop-link 480 200 \
            --hide-extension "${DMG_NAME}.app" \
            --no-internet-enable \
            "$1" \
            "$2"
          ls -lh "$1"
        }

        create_dmg "$DMG_FILE" "$APP_DIR"
        create_dmg "$DMG_ARM64" "$APP_DIR_ARM64"
        create_dmg "$DMG_X86_64" "$APP_DIR_X86_64"

        {
          echo "dmg_file=$DMG_FILE"
          echo "dmg_arm64=$DMG_ARM64"
          echo "dmg_x86_64=$DMG_X86_64"
        } >> "$GITHUB_OUTPUT"
    - name: Notarize DMGs
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        DMG_FILE: ${{ steps.dmg.outputs.dmg_file }}
        DMG_ARM64: ${{ steps.dmg.outputs.dmg_arm64 }}
        DMG_X86_64: ${{ steps.dmg.outputs.dmg_x86_64 }}
      run: |
        set -euo pipefail
        # Submit all three at once; each waits for Apple's verdict independently.
        dmgs=("$DMG_FILE" "$DMG_ARM64" "$DMG_X86_64")
        pids=()
        for dmg in "${dmgs[@]}"; do
          echo "==> Submitting $dmg for notarization"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 60m > "$RUNNER_TEMP/notarize-$dmg.log" 2>&1 &
          pids+=("$!")
        done

        failed=0
        for i in "${!dmgs[@]}"; do
          if wait "${pids[$i]}"; then status=succeeded; else status=FAILED; failed=1; fi
          echo "==> ${dmgs[$i]}: notarization $status"
          cat "$RUNNER_TEMP/notarize-${dmgs[$i]}.log"
        done
        if [ "$failed" -ne 0 ]; then
          echo "::error::Notarization failed for at least one DMG"
          exit 1
        fi
        echo "==> Notarization successful"
    - name: Staple notarization tickets
      env:
        DMG_FILE: ${{ steps.dmg.outputs.dmg_file }}
        DMG_ARM64: ${{ steps.dmg.outputs.dmg_arm64 }}
        DMG_X86_64: ${{ steps.dmg.outputs.dmg_x86_64 }}
      run: |
        set -euo pipefail
        for dmg in "$DMG_FILE" "$DMG_ARM64" "$DMG_X86_64"; do
          echo "==> Stapling notarization ticket to $dmg"
          xcrun stapler staple "$dmg"
          echo "==> Verifying stapled ticket"
          xcrun stapler validate "$dmg"
        done
    - name: Verify signed and notarized DMGs
      env:
        DMG_FILE: ${{ steps.dmg.outputs.dmg_file }}
        DMG_ARM64: ${{ steps.dmg.outputs.dmg_arm64 }}
        DMG_X86_64: ${{ steps.dmg.outputs.dmg_x86_64 }}
      run: |
        set -euo pipefail
        verify_dmg() {
          local dmg="$1" expected_archs="$2"
          echo "==> Verifying $dmg"
          hdiutil attach "$dmg" -mountpoint /tmp/pasta-verify
          echo "==> Checking code signature"
          codesign --verify --deep --strict --verbose=2 "/tmp/pasta-verify/${DMG_NAME}.app"
          archs=$(lipo -archs "/tmp/pasta-verify/${DMG_NAME}.app/Contents/MacOS/PastaApp")
          hdiutil detach /tmp/pasta-verify
          if [ "$archs" != "$expected_archs" ]; then
            echo "::error::$dmg contains '$archs', expected '$expected_archs'"
            exit 1
          fi
          # Check notarization ticket (stapler validate on the DMG already verified this)
          echo "==> Checking notarization"
          xcrun stapler validate "$dmg"
        }
        verify_dmg "$DMG_FILE" "x86_64 arm64"
        verify_dmg "$DMG_ARM64" "arm64"
        verify_dmg "$DMG_X86_64" "x86_64"
        echo "==> ✅ All verifications passed!"
    - name: Launch readiness smoke test (notarized DMG contents)
      env:
        DMG_FILE: ${{ steps.dmg.outputs.dmg_file }}
        DMG_ARM64: ${{ steps.dmg.outputs.dmg_arm64 }}
        DMG_X86_64: ${{ steps.dmg.outputs.dmg_x86_64 }}
      run: |
        set -euo pipefail
        smoke() {
          local dmg="$1" label="$2"
          local mountpoint="$RUNNER_TEMP/pasta-smoke-mnt-$label"
          local install_dir="$RUNNER_TEMP/pasta-smoke-Applications-$label"
          rm -rf "$install_dir"
          mkdir -p "$mountpoint" "$install_dir"
          hdiutil attach "$dmg" -mountpoint "$mountpoint" -nobrowse -readonly -noautoopen
          # Copy out exactly as a user dragging to /Applications would (ditto keeps
          # the signature and resource forks intact), then release the DMG.
          ditto "$mountpoint/${DMG_NAME}.app" "$install_dir/${DMG_NAME}.app"
          hdiutil detach "$mountpoint"
          echo "==> Launch smoke: $label"
          scripts/ci-launch-smoke.sh "$install_dir/${DMG_NAME}.app"
        }
        smoke "$DMG_FILE" universal
        smoke "$DMG_ARM64" arm64
        # The Intel-only build runs under Rosetta here; allow for first-launch translation.
        READY_TIMEOUT=90 smoke "$DMG_X86_64" x86_64
    - name: Generate Appcast for Sparkle Updates
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      run: "VERSION=\"${RELEASE_VERSION}\"\nDMG_PATH=\"${{ steps.dmg.outputs.dmg_file }}\"\n\nchmod +x scripts/generate-appcast.sh\n\
        ./scripts/generate-appcast.sh \\\n  \"$VERSION\" \\\n  \"$BUILD_NUMBER\" \\\n  \"$DMG_PATH\" \\\n  \"$SPARKLE_PRIVATE_KEY\"\
        \ \\\n  \"$RUNNER_TEMP/release-notes.html\" > \"$RUNNER_TEMP/appcast.xml\"\n\necho \"APPCAST_PATH=$RUNNER_TEMP/appcast.xml\"\
        \ >> \"$GITHUB_ENV\"\necho \"Generated appcast.xml:\"\ncat \"$RUNNER_TEMP/appcast.xml\"\n"
    - name: Require every surface gate before publishing the release
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'const { verifyManifestPublication } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-verify-landing-deploy.mjs`);

          await verifyManifestPublication({ github, ...context.repo, sha: process.env.RELEASE_SHA });

          '
    - name: Verify signed train identity and frozen notes
      run: |
        set -euo pipefail
        for app in "$APP_DIR" "$APP_DIR_ARM64" "$APP_DIR_X86_64"; do
          python3 scripts/verify-release-train-archive.py "$app" "$RUNNER_TEMP/release-manifest.json" mac-direct
        done
    - name: Stage immutable candidate assets
      env:
        DMG_FILE: ${{ steps.dmg.outputs.dmg_file }}
        DMG_ARM64: ${{ steps.dmg.outputs.dmg_arm64 }}
        DMG_X86_64: ${{ steps.dmg.outputs.dmg_x86_64 }}
      run: gh release upload "$RELEASE_TAG" "$DMG_FILE" "$DMG_ARM64" "$DMG_X86_64" "$APPCAST_PATH" .build/universal/PastaApp.dSYM.zip --clobber
    - name: Expose Alpha assets for external verification
      if: env.RELEASE_TRAIN == 'alpha'
      run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
    - name: Verify Alpha download, signature and launch from outside
      if: env.RELEASE_TRAIN == 'alpha'
      env:
        DMG_FILE: ${{ steps.dmg.outputs.dmg_file }}
      run: 'export APPCAST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/appcast.xml"

        export EXPECTED_FEED_URL="$FEED_URL"

        ENCODED_DMG=$(python3 -c ''import os,urllib.parse;print(urllib.parse.quote(os.environ["DMG_FILE"]))'')

        export EXPECTED_DMG_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$ENCODED_DMG"

        scripts/ci-verify-release.sh "$RELEASE_VERSION"'
    - name: Record verified candidate assets
      env:
        DMG_FILE: ${{ steps.dmg.outputs.dmg_file }}
        DMG_ARM64: ${{ steps.dmg.outputs.dmg_arm64 }}
        DMG_X86_64: ${{ steps.dmg.outputs.dmg_x86_64 }}
      run: node scripts/release-train.mjs receipt --tag "$RELEASE_TAG" --surface mac-direct --status verified --asset "$DMG_FILE"
        --asset "$DMG_ARM64" --asset "$DMG_X86_64" --asset "$APPCAST_PATH" --asset .build/universal/PastaApp.dSYM.zip
    - name: Publish Alpha prerelease only
      if: env.RELEASE_TRAIN == 'alpha'
      run: node scripts/release-train.mjs publish-alpha --tag "$RELEASE_TAG"
    - name: Cleanup keychain
      if: always()
      run: "python3 scripts/ci-keychain-search.py restore \"$RUNNER_TEMP/keychain-search.json\"\nrm -f certificate.p12\nif\
        \ [ -n \"${KEYCHAIN_PATH:-}\" ] && [ -f \"$KEYCHAIN_PATH\" ]; then\n  echo \"==> Cleaning up keychain\"\n  security\
        \ delete-keychain \"$KEYCHAIN_PATH\" || true\nfi\n"
    - name: Upload build artifacts (for debugging)
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: failed-build-artifacts
        path: '.build/

          entitlements.plist

          release_notes.md

          '
        retention-days: 7
    - name: Withdraw failed Alpha build
      if: always() && (failure() || cancelled()) && env.RELEASE_TRAIN == 'alpha'
      run: 'node scripts/release-train.mjs receipt --tag "$RELEASE_TAG" --surface mac-direct --status failed

        gh release edit "$RELEASE_TAG" --draft=true'
'on':
  workflow_call:
    inputs:
      manifest:
        required: true
        type: string
