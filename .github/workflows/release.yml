name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # Required to create releases
  actions: read  # Independently verify CI evidence for manually or automatically created tags

# Hold the publisher lock through live verification as well as publication.
# Otherwise a later release could replace the feed before this tag is checked.
concurrency:
  group: landing-page-deploy
  cancel-in-progress: false

env:
  APP_NAME: PastaApp
  BUNDLE_ID: com.pasta.clipboard
  DMG_NAME: Pasta

jobs:
  build-and-release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-15

    steps:
      # ============================================================================
      # CHECKOUT & SETUP
      # ============================================================================
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper version detection
      
      - name: Extract version from tag
        id: version
        run: |
          # Extract version from tag (e.g., v1.2.3 -> 1.2.3)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      
      # ============================================================================
      # BUILD
      # ============================================================================
      
      - name: Resolve Swift dependencies
        run: |
          python3 scripts/ci-verify-dependency-locks.py
          swift package resolve --force-resolved-versions
      
      - name: Build release binary (arm64)
        run: swift build --force-resolved-versions -c release --arch arm64
      
      - name: Build release binary (x86_64)
        run: swift build --force-resolved-versions -c release --arch x86_64
      
      - name: Create universal binary
        run: |
          mkdir -p .build/universal
          lipo -create \
            .build/arm64-apple-macosx/release/PastaApp \
            .build/x86_64-apple-macosx/release/PastaApp \
            -output .build/universal/PastaApp
          
          echo "==> Stripping debug symbols"
          strip -x .build/universal/PastaApp
          
          echo "==> Created universal binary"
          file .build/universal/PastaApp
          ls -lh .build/universal/PastaApp
      
      - name: Create app bundle structure
        run: |
          BUILD_DIR=".build/universal"
          # App bundle is named "Pasta.app" but executable inside is still "PastaApp"
          APP_DIR="${BUILD_DIR}/${DMG_NAME}.app"
          
          echo "==> Creating app bundle at $APP_DIR"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          mkdir -p "$APP_DIR/Contents/Frameworks"
          
          # Copy the universal binary (keep internal name as PastaApp)
          cp ".build/universal/${APP_NAME}" "$APP_DIR/Contents/MacOS/${APP_NAME}"
          
          # Copy resources
          if [ -d "Sources/PastaApp/Resources" ]; then
            cp -R Sources/PastaApp/Resources/* "$APP_DIR/Contents/Resources/" || true
          fi
          
          # Copy app icon to Resources
          cp "Resources/DMG/AppIcon.icns" "$APP_DIR/Contents/Resources/AppIcon.icns"
          
          # Copy Sparkle framework
          SPARKLE_PATH=$(find .build -name "Sparkle.framework" -type d | head -1)
          if [ -n "$SPARKLE_PATH" ]; then
            echo "==> Copying Sparkle framework from $SPARKLE_PATH"
            cp -R "$SPARKLE_PATH" "$APP_DIR/Contents/Frameworks/"
          else
            echo "ERROR: Sparkle.framework not found!"
            exit 1
          fi
          
          # Fix rpath to find frameworks in Contents/Frameworks
          echo "==> Fixing rpath for Sparkle framework"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_DIR/Contents/MacOS/${APP_NAME}"
          
          # Verify rpath
          echo "==> Verifying rpath:"
          otool -l "$APP_DIR/Contents/MacOS/${APP_NAME}" | grep -A2 LC_RPATH
          
          # Make executable
          chmod +x "$APP_DIR/Contents/MacOS/${APP_NAME}"
          
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
      
      - name: Generate Info.plist with version
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          # Public (write-only) PostHog ingestion key. Safe to ship in a client.
          # When the secret is unset this expands to an empty string and the app's
          # analytics are a permanent, silent no-op.
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        run: |
          # Get the short commit SHA
          COMMIT_SHA=$(git rev-parse --short HEAD)
          
          cat > "${APP_DIR}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Pasta</string>
              <key>CFBundleDisplayName</key>
              <string>Pasta</string>
              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_ID}</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_RUN_NUMBER}</string>
              <key>CFBundleShortVersionString</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.productivity</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
              <key>NSHumanReadableCopyright</key>
              <string>© $(date +%Y) Pasta</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>LSUIElement</key>
              <true/>
              <!-- Git Commit SHA for About screen -->
              <key>GitCommitSHA</key>
              <string>${COMMIT_SHA}</string>
              <!-- Sparkle Auto-Update Configuration -->
              <key>SUFeedURL</key>
              <string>https://pasta-app.com/appcast.xml</string>
              <key>SUPublicEDKey</key>
              <string>${SPARKLE_PUBLIC_KEY}</string>
              <key>SUEnableAutomaticChecks</key>
              <true/>
              <key>SUScheduledCheckInterval</key>
              <integer>86400</integer>
              <!-- Opt-in product analytics. Empty key = analytics disabled entirely. -->
              <key>PostHogProjectKey</key>
              <string>${POSTHOG_PROJECT_KEY}</string>
              <key>PostHogHost</key>
              <string>https://eu.i.posthog.com</string>
          </dict>
          </plist>
          PLIST
          
          echo "==> Info.plist created"
          cat "${APP_DIR}/Contents/Info.plist"
      
      # ============================================================================
      # CODE SIGNING
      # ============================================================================
      
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          echo "==> Creating temporary keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          echo "==> Importing certificate"
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          
          # Set keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Clean up certificate file
          rm certificate.p12
          
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          
          echo "==> Certificate imported successfully"
      
      - name: Find signing identity
        id: signing
        run: |
          # Find the Developer ID Application certificate
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | grep -o '".*"' | tr -d '"')
          
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No Developer ID Application certificate found!"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          
          echo "identity=$IDENTITY" >> $GITHUB_OUTPUT
          echo "==> Found signing identity: $IDENTITY"
      
      - name: Prepare entitlements file
        run: |
          cp Resources/release.entitlements entitlements.plist
          echo "==> Entitlements file:"
          cat entitlements.plist
      
      - name: Validate entitlements (no restricted keys without profile)
        run: |
          # These entitlements require specific provisioning profile capabilities.
          # Adding one without updating the profile will cause SIGKILL on launch.
          RESTRICTED_KEYS="aps-environment get-task-allow com.apple.developer.team-identifier"
          
          for key in $RESTRICTED_KEYS; do
            if grep -q "$key" entitlements.plist; then
              echo "ERROR: entitlements.plist contains restricted key '$key'."
              echo "This requires a matching provisioning profile capability."
              echo "Remove it or update the profile before releasing."
              exit 1
            fi
          done
          echo "==> Entitlements validation passed (no unexpected restricted keys)"
      
      - name: Embed provisioning profile
        run: |
          echo "${{ secrets.MACOS_PROVISIONING_PROFILE }}" | base64 -D -o "${APP_DIR}/Contents/embedded.provisionprofile"
          echo "==> Provisioning profile embedded"
          ls -la "${APP_DIR}/Contents/embedded.provisionprofile"
      
      - name: Code sign app bundle
        run: |
          echo "==> Signing app bundle with hardened runtime"
          IDENTITY="${{ steps.signing.outputs.identity }}"
          
          # Sign framework internals first (WITHOUT app entitlements)
          # Applying iCloud/CloudKit entitlements to framework binaries causes
          # dyld signature rejection at launch.
          echo "==> Signing framework binaries (no app entitlements)..."
          find "${APP_DIR}/Contents/Frameworks" -type f -perm +111 | while read binary; do
            if file "$binary" | grep -q "Mach-O"; then
              echo "  Signing: $binary"
              codesign --force \
                --sign "$IDENTITY" \
                --options runtime \
                --timestamp \
                "$binary" || true
            fi
          done
          
          # Sign framework bundles (XPC services, apps inside frameworks)
          find "${APP_DIR}/Contents/Frameworks" -name "*.xpc" -o -name "*.app" | while read bundle; do
            if [ -d "$bundle" ]; then
              echo "  Signing bundle: $bundle"
              codesign --force \
                --sign "$IDENTITY" \
                --options runtime \
                --timestamp \
                "$bundle" || true
            fi
          done
          
          # Sign the framework itself
          find "${APP_DIR}/Contents/Frameworks" -name "*.framework" | while read fw; do
            echo "  Signing framework: $fw"
            codesign --force \
              --sign "$IDENTITY" \
              --options runtime \
              --timestamp \
              "$fw" || true
          done
          
          # Sign the main app binary WITH entitlements
          echo "==> Signing main binary with entitlements..."
          codesign --force \
            --sign "$IDENTITY" \
            --options runtime \
            --timestamp \
            --entitlements entitlements.plist \
            "${APP_DIR}/Contents/MacOS/PastaApp"
          
          # Sign the app bundle (top-level, with entitlements)
          echo "==> Signing app bundle..."
          codesign --force \
            --sign "$IDENTITY" \
            --options runtime \
            --timestamp \
            --entitlements entitlements.plist \
            "${APP_DIR}"
          
          echo "==> Verifying signature"
          codesign --verify --verbose=4 "${APP_DIR}"
          
          # Verify entitlements are NOT on framework binaries
          echo "==> Checking framework entitlements are clean..."
          SPARKLE_ENTS=$(codesign -d --entitlements - "${APP_DIR}/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" 2>&1 || true)
          if echo "$SPARKLE_ENTS" | grep -q "icloud"; then
            echo "ERROR: Sparkle binary has iCloud entitlements — this will crash at launch!"
            exit 1
          fi
          echo "✓ Framework entitlements are clean"
      
      # ============================================================================
      # CREATE DMG
      # ============================================================================
      
      - name: Install create-dmg
        run: brew install create-dmg
      
      - name: Generate DMG assets
        run: |
          cd Resources/DMG
          
          echo "==> Generating app icon (icns)"
          chmod +x create-icns.sh
          ./create-icns.sh
          
          echo "==> Generating background image"
          chmod +x create-background.sh
          ./create-background.sh
      
      - name: Create fancy DMG
        id: dmg
        run: |
          DMG_FILE="${DMG_NAME}-${{ steps.version.outputs.version }}.dmg"
          
          echo "==> Creating DMG with custom background and layout"
          create-dmg \
            --volname "${DMG_NAME}" \
            --volicon "Resources/DMG/AppIcon.icns" \
            --background "Resources/DMG/background@2x.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "${DMG_NAME}.app" 180 200 \
            --app-drop-link 480 200 \
            --hide-extension "${DMG_NAME}.app" \
            --no-internet-enable \
            "${DMG_FILE}" \
            "${APP_DIR}"
          
          echo "dmg_file=$DMG_FILE" >> $GITHUB_OUTPUT
          echo "==> DMG created: $DMG_FILE"
          ls -lh "$DMG_FILE"
      
      # ============================================================================
      # NOTARIZATION
      # ============================================================================
      
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_FILE="${{ steps.dmg.outputs.dmg_file }}"
          
          echo "==> Submitting DMG for notarization"
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 60m
          
          echo "==> Notarization successful"
      
      - name: Staple notarization ticket
        run: |
          DMG_FILE="${{ steps.dmg.outputs.dmg_file }}"
          
          echo "==> Stapling notarization ticket to DMG"
          xcrun stapler staple "$DMG_FILE"
          
          echo "==> Verifying stapled ticket"
          xcrun stapler validate "$DMG_FILE"
      
      # ============================================================================
      # VERIFICATION
      # ============================================================================
      
      - name: Verify signed and notarized DMG
        run: |
          DMG_FILE="${{ steps.dmg.outputs.dmg_file }}"
          
          echo "==> Verifying DMG"
          
          # Mount DMG
          hdiutil attach "$DMG_FILE" -mountpoint /tmp/pasta-verify
          
          # Verify signature
          echo "==> Checking code signature"
          codesign --verify --deep --strict --verbose=2 "/tmp/pasta-verify/${DMG_NAME}.app"
          
          # Check notarization ticket (stapler validate on the DMG already verified this)
          echo "==> Checking notarization"
          xcrun stapler validate "$DMG_FILE"
          
          # Unmount
          hdiutil detach /tmp/pasta-verify
          
          echo "==> ✅ All verifications passed!"
      
      # RELEASE GATE: the app inside the signed, notarized, stapled DMG — the
      # exact bytes users download — must initialise (PASTA_CI_READY marker
      # from BackgroundService, see Sources/PastaApp/CIReadiness.swift) and quit
      # cleanly on SIGTERM. Same script as ci.yml's PR smoke test, so a PR-green
      # build cannot ship a launch regression that only the notarized bundle
      # exhibits (AMFI, dyld library validation, entitlement/profile mismatch).
      # Runs BEFORE "Create GitHub Release": a failure here publishes nothing.
      - name: Launch readiness smoke test (notarized DMG contents)
        run: |
          set -euo pipefail
          DMG_FILE="${{ steps.dmg.outputs.dmg_file }}"
          MOUNTPOINT="$RUNNER_TEMP/pasta-smoke-mnt"
          INSTALL_DIR="$RUNNER_TEMP/pasta-smoke-Applications"
          mkdir -p "$MOUNTPOINT" "$INSTALL_DIR"
          hdiutil attach "$DMG_FILE" -mountpoint "$MOUNTPOINT" -nobrowse -readonly -noautoopen
          # Copy out exactly as a user dragging to /Applications would (ditto keeps
          # the signature and resource forks intact), then release the DMG.
          ditto "$MOUNTPOINT/${DMG_NAME}.app" "$INSTALL_DIR/${DMG_NAME}.app"
          hdiutil detach "$MOUNTPOINT"
          scripts/ci-launch-smoke.sh "$INSTALL_DIR/${DMG_NAME}.app"
      
      # ============================================================================
      # RELEASE
      # ============================================================================
      
      - name: Generate detailed release notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELEASE_NOTES_MODEL: gpt-5.6-luna
          RELEASE_NOTES_REASONING_EFFORT: medium
        run: |
          node scripts/generate-release-notes.mjs \
            --tag "${GITHUB_REF_NAME}" \
            --output "$RUNNER_TEMP/generated-release-notes.md" \
            --html-output "$RUNNER_TEMP/release-notes.html"

      - name: Assemble GitHub release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cat > release_notes.md <<EOF
          # Pasta ${VERSION}
          
          ## 🍝 Your clipboard, al dente.
          
          A blazing-fast, local-first clipboard history manager for macOS with intelligent content detection.
          
          ### Installation
          
          1. Download \`${{ steps.dmg.outputs.dmg_file }}\`
          2. Open the DMG and drag **Pasta** to your Applications folder
          3. Launch Pasta from Applications
          4. Grant Accessibility permissions when prompted (recommended for full functionality)
          
          ### Requirements
          
          - macOS 14.0 (Sonoma) or later
          - Apple Silicon (M1/M2/M3) or Intel Mac
          
          ### Features
          
          - ✨ **Unlimited clipboard history** — Never lose a copied item
          - 🧠 **Smart content detection** — Auto-categorizes emails, JWTs, code, URLs, and more
          - ⚡ **Ultra-fast search** — Full-text search with fuzzy matching
          - ⌨️  **Keyboard-first** — Global hotkey (\`⌃⌘V\`) and full navigation
          - 👁️  **Rich previews** — Images, decoded base64, syntax-highlighted code
          - 🔒 **Privacy-first** — Local storage with optional private iCloud sync
          
          ### Usage
          
          1. Copy anything (text, URLs, images, etc.)
          2. Press **\`⌃⌘V\`** to show Pasta
          3. Search, navigate with **↑/↓**, press **Enter** to paste
          
          ### Verification
          
          This release is code-signed and notarized by Apple for secure distribution outside the Mac App Store.
          
          \`\`\`bash
          # Verify code signature
          codesign --verify --deep --strict /Applications/Pasta.app
          
          # Check notarization
          spctl --assess --type execute --verbose /Applications/Pasta.app
          \`\`\`
          
          EOF
          
          cat "$RUNNER_TEMP/generated-release-notes.md" >> release_notes.md
          cat >> release_notes.md <<EOF
          ---
          
          **SHA-256 Checksum:**
          \`\`\`
          $(shasum -a 256 "${{ steps.dmg.outputs.dmg_file }}" | awk '{print $1}')
          \`\`\`
          EOF
          
          echo "Release notes generated"
          cat release_notes.md
      
      - name: Generate Appcast for Sparkle Updates
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          DMG_PATH="${{ steps.dmg.outputs.dmg_file }}"
          
          chmod +x scripts/generate-appcast.sh
          ./scripts/generate-appcast.sh \
            "$VERSION" \
            "$BUILD_NUMBER" \
            "$DMG_PATH" \
            "$SPARKLE_PRIVATE_KEY" \
            "$RUNNER_TEMP/release-notes.html" > "$RUNNER_TEMP/appcast.xml"
          
          echo "APPCAST_PATH=$RUNNER_TEMP/appcast.xml" >> "$GITHUB_ENV"
          echo "Generated appcast.xml:"
          cat "$RUNNER_TEMP/appcast.xml"
      
      # Manual tags must satisfy the same surface gates as auto-release.
      # CI may still be running its tag-push job; the shared gate requires
      # completed successful surface jobs without waiting on that parent run.
      - name: Require every surface gate before publishing the release
        uses: actions/github-script@v7
        with:
          script: |
            const { verifyReleasePublication } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-verify-landing-deploy.mjs`);
            await verifyReleasePublication({ github, ...context.repo, sha: process.env.RELEASE_SHA });

      - name: Mark publication attempt
        id: publication_attempt
        run: echo 'started=true' >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: publish
        uses: softprops/action-gh-release@v1
        with:
          name: Pasta ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            ${{ steps.dmg.outputs.dmg_file }}
            ${{ env.APPCAST_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update landing page appcast.xml
        run: |
          # Copy the generated appcast to the landing-page directory for deployment
          cp "$APPCAST_PATH" landing-page/appcast.xml
          echo "Appcast copied to landing-page/appcast.xml"
      
      - name: Refuse superseded release landing source
        uses: actions/github-script@v7
        with:
          script: |
            const { verifyCurrentLandingSource } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-verify-landing-deploy.mjs`);
            await verifyCurrentLandingSource({ github, ...context.repo, sha: process.env.RELEASE_SHA });

      - name: Deploy landing page with updated appcast
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy landing-page --project-name=pasta-app --branch=main

      # Keep landing-page/appcast.xml in git equal to the feed just deployed, so
      # deploy-landing-page.yml never re-publishes a stale copy and the
      # appcast-contract test can require the newest tag. Non-fatal by design:
      # the release is already live and verify-release must still run. The
      # script falls back to a release/appcast-v* branch + PR if main is
      # protected against direct pushes (see scripts/ci-commit-appcast.sh).
      - name: Commit regenerated appcast back to main
        env:
          GH_TOKEN: ${{ secrets.AUTO_RELEASE_TOKEN }}
        run: scripts/ci-commit-appcast.sh "$APPCAST_PATH" "${{ steps.version.outputs.version }}"

      # ============================================================================
      # UPDATE HOMEBREW TAP
      # ============================================================================
      
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_FILE="${{ steps.dmg.outputs.dmg_file }}"
          SHA256=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')
          
          echo "==> Updating Homebrew tap for version $VERSION"
          echo "    SHA256: $SHA256"
          
          # Clone the tap repo
          git clone https://x-access-token:${GH_TOKEN}@github.com/crmitchelmore/homebrew-pasta.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          
          # Update the cask file
          cat > Casks/pasta.rb << EOF
          cask "pasta" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/crmitchelmore/pasta/releases/download/v#{version}/Pasta-#{version}.dmg"
            name "Pasta"
            desc "Blazing-fast, local-first clipboard history manager for macOS"
            homepage "https://pasta-app.com"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: ">= :sonoma"

            app "Pasta.app"

            zap trash: [
              "~/Library/Application Support/Pasta",
              "~/Library/Caches/com.pasta.clipboard",
              "~/Library/Preferences/com.pasta.clipboard.plist",
            ]
          end
          EOF
          
          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash "$GITHUB_WORKSPACE/scripts/ci-commit-homebrew.sh" "$VERSION"
          
          echo "==> Homebrew tap updated successfully"
      
      # ============================================================================
      # CLEANUP
      # ============================================================================
      
      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then
            echo "==> Cleaning up keychain"
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
      
      - name: Upload build artifacts (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-artifacts
          path: |
            .build/
            entitlements.plist
            release_notes.md
          retention-days: 7

      # A later deploy/source-check/tap failure skips verify-release entirely.
      # An asset upload may fail after creating a public release. Query after
      # every publication attempt, including failed/cancelled action outcomes.
      - name: Draft release after publication failure
        if: ${{ always() && (failure() || cancelled()) && steps.publication_attempt.outputs.started == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { draftAttemptedRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-draft-release.mjs`);
            const result = await draftAttemptedRelease({ github, ...context.repo, tag: process.env.GITHUB_REF_NAME });
            core.error(`Release publication failed or was cancelled; cleanup: ${result}. Inspect the live appcast and Homebrew cask before retrying; drafting does not roll those back.`);

  # ============================================================================
  # POST-PUBLISH VERIFICATION — the "certainty" gate for auto-update users.
  # ============================================================================
  # Treats the live world as the source of truth: fetches the appcast Sparkle
  # clients poll, follows its enclosure to the GitHub release asset, downloads
  # the DMG, and puts the shipped app through Gatekeeper, codesign and the same
  # launch-readiness smoke test. If anything fails the GitHub release is flipped
  # back to DRAFT (asset URLs stop resolving, so Sparkle cannot fetch it) and the
  # job fails loudly. See scripts/ci-verify-release.sh for the exact checks.
  verify-release:
    name: Verify published release (live appcast + DMG)
    needs: build-and-release
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write  # gh release edit --draft on failure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify live appcast, DMG, Gatekeeper, signature and launch
        id: verify
        run: scripts/ci-verify-release.sh "${GITHUB_REF_NAME#v}"

      - name: Pull the release back to draft
        if: ${{ always() && (failure() || cancelled()) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "==> Post-publish verification failed or was interrupted for $TAG; converting the GitHub release to a draft so Sparkle clients cannot download it."
          if gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft; then
            echo "::error title=Release $TAG pulled::verify-release failed. The GitHub release $TAG has been converted to a DRAFT (its DMG is no longer downloadable, so auto-update cannot pick it up). Inspect the currently advertised appcast version and Homebrew cask before any rollback. Restore their previous verified versions only if they still advertise this failed $TAG; do not overwrite a newer healthy release. Drafting cannot revoke existing downloads. See the 'Verify live appcast, DMG, Gatekeeper, signature and launch' step for what failed."
          else
            echo "::error title=Release $TAG NOT pulled::verify-release failed AND 'gh release edit --draft' also failed. Manually draft or delete the GitHub release $TAG NOW: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          fi
          exit 1
